[package]
name = "glass-browser"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SnehannUni/glass-browser"

[dependencies]
tao = "0.35"
wry = "0.55"
window-vibrancy = "0.6"
serde_json = "1"
base64 = "0.22"
# Werbeblocker: Filter-Engine von Brave (ABP/uBO-Syntax); ohne "single-thread", damit sie im Hintergrund gebaut werden kann
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# Direkter Zugriff auf WebView2 (z. B. Vollbild-Ereignis); Versionen wie in wry
webview2-com = "0.38"
# PDFs mit Passwort schützen (AES-256, pdf.rs)
lopdf = { version = "0.45", default-features = false }
getrandom = "0.3"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
# Icon und Versionsinfos in die Exe einbetten (build.rs)
winresource = "0.1"
