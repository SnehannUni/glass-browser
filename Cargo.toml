[package]
name = "glass-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.35"
wry = "0.55"
window-vibrancy = "0.6"
serde_json = "1"
# Werbeblocker: Filter-Engine von Brave (ABP/uBO-Syntax); ohne "single-thread", damit sie im Hintergrund gebaut werden kann
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# Direkter Zugriff auf WebView2 (z. B. Vollbild-Ereignis); Versionen wie in wry
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
