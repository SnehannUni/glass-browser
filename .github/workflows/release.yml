# Baut bei jedem Push auf main die fertige Browser.exe und veröffentlicht sie als Release „build-<Nummer>“.
# Glass prüft dieses Release beim Start und bietet neuere Versionen im Update-Modal an (src/update.rs).
# Dazu kommt das Paket für den Microsoft Store (WinterBrowser-Store-build-<Nummer>.msix, siehe store/README.md).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Auch manuelle Starts auf Feature-Branches dürfen kein offizielles Release erzeugen.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      # Build-Nummer, die in die Exe eingebaut wird – daran erkennt Glass neuere Versionen
      GLASS_BUILD: ${{ github.run_number }}
      GLASS_RELEASE_REF: ${{ github.ref }}
    steps:
      # Fremde Actions auf Commits festgelegt: Ein umgehängter Tag kann nichts in die Releases schmuggeln.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Bauen
        run: cargo build --release --locked

      - name: Lizenzen der Bibliotheken
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about
      - run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Store-Version bauen
        # ohne Selbst-Update, Registry-Anmeldung und iCloud-Passwörter; eigener Ordner, damit Browser.exe unverändert bleibt
        run: cargo build --release --locked --features store --target-dir target-store

      - name: Store-Paket (MSIX)
        shell: pwsh
        # Identität aus dem Partner Center (Repository-Variablen); fehlen sie, entsteht ein Testpaket
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: ./store/build-msix.ps1 -Exe target-store/release/glass-browser.exe -Build ${{ github.run_number }} -Out WinterBrowser-Store-build-${{ github.run_number }}.msix

      - name: Dateien fürs Release
        shell: pwsh
        # Glass.exe: dieselbe Datei für ältere Installationen (bis Build 4), die noch nach diesem Namen suchen
        run: |
          Copy-Item target/release/glass-browser.exe Browser.exe
          Copy-Item target/release/glass-browser.exe Glass.exe

      # Signatur fürs Auto-Update (src/signature.rs). Ohne das Secret bricht der Lauf ab – lieber kein Release als ein
      # unsigniertes, das ohnehin keine Installation annehmen würde.
      - name: Signieren
        env:
          GLASS_SIGNING_KEY: ${{ secrets.GLASS_SIGNING_KEY }}
        run: cargo run --release --locked --example sign -- Browser.exe ${{ github.run_number }} Browser.exe.sig

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: build-${{ github.run_number }}
          name: Winter Browser Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Browser.exe
            Browser.exe.sig
            Glass.exe
            WinterBrowser-Store-build-${{ github.run_number }}.msix
            THIRD_PARTY_LICENSES.html
            LICENSE
