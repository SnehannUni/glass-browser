        rm.className = 'rm';
        rm.title = 'Aus dem Verlauf entfernen';
        rm.innerHTML = svg('close');
        rm.addEventListener('pointerdown', (e) => {
          e.preventDefault(); e.stopPropagation(); // Fokus bleibt im Feld, nicht suchen
          forget(searchEngine().id, item.text);
          refreshSuggest(typed, related);
        });
        row.append(rm);
      }
      row.addEventListener('pointerdown', (e) => {
        e.preventDefault(); // Fokus im Feld behalten
        input.value = item.text;
        address.requestSubmit();
      });
      nodes.push(row);
    });
    suggestBox.replaceChildren(...nodes);
    markSelected();
    suggestPending = true;
    placeSuggest();
  }

  // Liste unter das Feld legen – fährt es gerade aus, erst wenn es seine Endbreite hat (slideDone)
  let suggestPending = false;
  function placeSuggest() {
    if (!suggestPending || address.classList.contains('resizing')) return;
    suggestPending = false;
    const r = layoutRect(address);
    Object.assign(suggestBox.style, { left: `${r.left}px`, top: `${r.bottom + 8}px`, width: `${r.width}px` });
    suggestBox.classList.add('open');
    reportOverlay();
    scheduleInk();
  }

  function markSelected() {
    suggestBox.querySelectorAll('.sg').forEach((row, i) => row.classList.toggle('sel', i === selected));
  }

  // Rust spart die Liste aus der Webseiten-Region aus, sonst läge die Seite darüber.
  // Layoutwerte statt getBoundingClientRect, damit die Einblend-Animation nicht mitgemessen wird.
  function reportOverlay() {
    const open = suggestBox.classList.contains('open');
    if (!open && upBox.classList.contains('open')) { reportUpdateOverlay(); return; } // das Modal bleibt ausgespart
    send('overlay', {
      rect: open ? { x: parseFloat(suggestBox.style.left), y: parseFloat(suggestBox.style.top),
                     w: suggestBox.offsetWidth, h: suggestBox.offsetHeight, r: 18 } : null,
    });
  }

  // Position aus dem Layout, ohne laufende Animationen: Beim Wechsel zum Startbildschirm gleitet das
  // Suchfeld noch in die Mitte, getBoundingClientRect() würde die Zwischenposition liefern.
  function layoutRect(el) {
    let x = 0, y = 0;
    for (let n = el; n; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
    return { left: x, top: y, width: el.offsetWidth, bottom: y + el.offsetHeight };
  }

  function hideSuggest() {
    suggestions = [];
    selected = -1;
    suggestPending = false;
    if (!suggestBox.classList.contains('open')) return;
    suggestBox.classList.remove('open');
    reportOverlay();
  }

  // Schließen und laufende Google-Anfragen verwerfen
  function closeSuggest() {
    suggestSeq++;
    clearTimeout(suggestTimer);
    hideSuggest();
  }
  window.focusAddress = () => { input.focus(); input.select(); };

  // ---------- Favoriten (nur lokal, im Speicher der Oberfläche) ----------
  const FAV_KEY = 'glass.favorites';
  let favorites = [];
  try { favorites = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { /* leer starten */ }
  const saveFavorites = () => { try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch { /* egal */ } };
  const sameUrl = (a, b) => a.replace(/#.*$/, '').replace(/\/$/, '') === b.replace(/#.*$/, '').replace(/\/$/, '');
  const isFavorite = (url) => !!url && favorites.some((f) => sameUrl(f.url, url));

  // Stern links in der Adresszeile
  const star = $('btn-star');
  function renderStar() {
    const tab = activeTab();
    const on = isFavorite(tab?.url || '');
    star.hidden = !tab?.page;
    star.classList.toggle('on', on);
    star.innerHTML = svg(on ? 'starFill' : 'star');
    star.title = on ? 'Aus den Favoriten entfernen' : 'Zu den Favoriten hinzufügen';
  }
  star.addEventListener('click', () => {
    const tab = activeTab();
    if (!tab?.url) return;
    if (isFavorite(tab.url)) favorites = favorites.filter((f) => !sameUrl(f.url, tab.url));
    else favorites.unshift({ url: tab.url, title: tab.title || hostOf(tab.url) });
    saveFavorites();
    renderStar();
    star.classList.remove('pop'); void star.offsetWidth; star.classList.add('pop');
    if (favPanel.classList.contains('open')) renderFavorites();
  });

  // Knopf oben rechts: beim Drüberfahren klappt die Liste aus
  const favBtn = $('btn-favs'), favPanel = $('favs'), privateBtn = $('btn-private');
  let favTimer = 0;
  function renderFavorites() {
    const head = document.createElement('div');
    head.className = 'fv-head';
    head.textContent = 'Favoriten';
    const rows = favorites.map((f) => {
      const row = document.createElement('div');
      row.className = 'fv';
      row.title = f.url;
      row.innerHTML = `<span class="fv-ic">${svg('globe')}</span><span class="fv-text"><span class="fv-title"></span><span class="fv-host"></span></span>`;
      row.querySelector('.fv-title').textContent = f.title || hostOf(f.url);
      row.querySelector('.fv-host').textContent = hostOf(f.url);
      const origin = parse(f.url)?.origin;
      if (origin?.startsWith('http')) {
        const img = new Image();
        img.onload = () => row.querySelector('.fv-ic').replaceChildren(img);
        img.src = `${origin}/favicon.ico`;
      }
      const rm = document.createElement('button');
      rm.className = 'rm';
      rm.title = 'Aus den Favoriten entfernen';
      rm.innerHTML = svg('close');
      rm.addEventListener('click', (e) => {
        e.stopPropagation();
        favorites = favorites.filter((x) => x !== f);
        saveFavorites();
        renderStar();
        renderFavorites();
      });
      row.append(rm);
      row.addEventListener('click', () => { closeFavorites(); send('navigate', { value: f.url }); });
      return row;
    });
    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'fv-empty';
      empty.textContent = 'Noch keine Favoriten. Tippe auf den Stern in der Adresszeile, um eine Seite zu speichern.';
      rows.push(empty);
    }
    favPanel.replaceChildren(head, ...rows);
    placeFavorites();
  }
  function placeFavorites() {
    if (!favPanel.classList.contains('open')) return;
    const r = layoutRect(favBtn);
    Object.assign(favPanel.style, { left: `${Math.max(8, r.left + r.width - 320)}px`, top: `${r.bottom + 8}px` });
    // Über einer Webseite: wie bei den Vorschlägen aus deren Region aussparen
    send('overlay', { rect: { x: parseFloat(favPanel.style.left), y: parseFloat(favPanel.style.top),
                              w: favPanel.offsetWidth, h: favPanel.offsetHeight, r: 18 } });
    scheduleInk();
  }
  function openFavorites() {
    clearTimeout(favTimer);
    if (favPanel.classList.contains('open')) return;
    closeSuggest();
    favPanel.classList.add('open');
    favBtn.classList.add('open');
    renderFavorites();
  }
  function closeFavorites() {
    clearTimeout(favTimer);
    if (!favPanel.classList.contains('open')) return;
    favPanel.classList.remove('open');
    favBtn.classList.remove('open');
    if (upBox.classList.contains('open')) reportUpdateOverlay();
    else if (!suggestBox.classList.contains('open')) send('overlay', { rect: null });
  }
  const closeFavoritesSoon = () => { clearTimeout(favTimer); favTimer = setTimeout(closeFavorites, 250); };

  // ---------- Update-Modal (Rust meldet ein neueres Release von GitHub) ----------
  const upBox = $('update'), upInstall = $('up-install');
  let upDismissed = 0; // „Später“ gilt bis zum nächsten Start bzw. bis eine noch neuere Version kommt
  // Über einer Webseite liegt das Modal nur sichtbar, wenn Rust es aus deren Region ausspart
  const reportUpdateOverlay = () => send('overlay', { rect: {
    x: upBox.offsetLeft, y: upBox.offsetTop, w: upBox.offsetWidth, h: upBox.offsetHeight, r: 22 } });
  window.showUpdate = ({ build, current, notes }) => {
    if (build <= upDismissed || upBox.classList.contains('open')) return;
    input.blur(); closeSuggest(); closeFavorites();
    $('up-version').textContent = `Build ${build} ist da – du hast Build ${current}.`;
    // Aus der Commit-Nachricht nur die ersten Zeilen (Mitautoren-Zeilen weglassen)
    $('up-notes').textContent = notes.split('\n').filter((l) => !/^co-authored-by/i.test(l.trim())).join('\n').trim().slice(0, 600);
    $('up-error').textContent = '';
    upInstall.disabled = false; upInstall.textContent = 'Jetzt installieren';
    upBox.classList.add('open');
    document.body.classList.add('modal');
    requestAnimationFrame(reportUpdateOverlay);
    upBox.dataset.build = build;
  };
  const closeUpdate = () => { upBox.classList.remove('open'); document.body.classList.remove('modal'); send('overlay', { rect: null }); };
  $('up-later').addEventListener('click', () => { upDismissed = Number(upBox.dataset.build) || 0; closeUpdate(); });
  upInstall.addEventListener('click', () => {
    upInstall.disabled = true;
    upInstall.innerHTML = '<span class="spinner"></span>Wird installiert …';
    $('up-error').textContent = '';
    send('update_install');
  });
  window.updateFailed = (msg) => {
    upInstall.disabled = false; upInstall.textContent = 'Erneut versuchen';
    $('up-error').textContent = `Update fehlgeschlagen: ${msg}`;
    requestAnimationFrame(reportUpdateOverlay);
  };
  addEventListener('resize', () => { if (upBox.classList.contains('open')) reportUpdateOverlay(); });
  favBtn.addEventListener('pointerenter', openFavorites);
  favBtn.addEventListener('pointerleave', closeFavoritesSoon);
  favBtn.addEventListener('click', () => (favPanel.classList.contains('open') ? closeFavorites() : openFavorites()));
  favPanel.addEventListener('pointerenter', () => clearTimeout(favTimer));
  favPanel.addEventListener('pointerleave', closeFavoritesSoon);

  // ---------- Hover, gemeldet von Rust ----------
  // Hat eine Webseite den Tastaturfokus, liefert WebView2 der Oberfläche keine Hover-Ereignisse.
  // Das Licht verfolgt auch die Position über Webseiten. Nur echte UI-Treffer erhalten .vh.
  let vhover = [];
  window.hoverAt = (x, y, overUI = true) => {
    chromeHover(y);
    window.GroupHover.at(x, y, overUI);
    trackLight(x, y);
    const el = x == null || !overUI ? null : document.elementFromPoint(x, y);
    const chain = [];
    for (let n = el; n && n !== document.body; n = n.parentElement) chain.push(n);
    vhover.forEach((n) => { if (!chain.includes(n)) n.classList.remove('vh'); });
    chain.forEach((n) => n.classList.add('vh'));
    vhover = chain;
    if (chain.includes(favBtn) || chain.includes(favPanel)) openFavorites();
    else if (favPanel.classList.contains('open') && !favBtn.matches(':hover') && !favPanel.matches(':hover')) closeFavoritesSoon();
  };

  // Wechsel Startbildschirm ↔ Seite: das Adressfeld gleitet von der Mitte in die Toolbar (und zurück).
  // FLIP: alte Position messen, Layout umschalten, dann von der alten Form zur neuen federn.
  function setStartMode(start) {
    if (document.body.classList.contains('start') === start) return;
    closeWheel();
    const from = address.getBoundingClientRect();
    // Größe springt sofort (die Bewegung macht die Animation unten) – sonst liefe zusätzlich der Breiten-Übergang
    address.style.transition = 'none';
    document.body.classList.toggle('start', start);
    document.body.classList.toggle('searching', !start && editing());
    const to = address.getBoundingClientRect();
    requestAnimationFrame(() => { address.style.transition = ''; });
    scheduleInk();
    setTimeout(scheduleInk, 700);
    if (!from.width) return;
    address.animate([
      { transformOrigin: '0 0', transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width}, ${from.height / to.height})` },
      { transformOrigin: '0 0', transform: 'none' },
    ], { duration: 650, easing: 'cubic-bezier(.3, 1.25, .45, 1)' });
  }

  // ---------- Geteilte Ansicht ----------
  // Die Teilung ist sichtbar, solange einer ihrer beiden Tabs aktiv ist.
  const activeSplit = () =>
    state.split && [state.split.left, state.split.right].includes(state.active) ? state.split : null;

  // `from`: bisherige Rahmen, wenn die Leiste oben gerade aus- oder einfährt – dann gleiten sie mit der Seite mit
  function renderPanes(from = null) {
    if (resizeDrag) return;
    const panes = (state.panes || []).filter((p) => hasPage(p.id));
    $('panes').replaceChildren(...panes.map((p) => {
      const el = document.createElement('div');
      el.className = `pane${p.id === state.active ? ' focus' : ''}`;
      Object.assign(el.style, { left: `${p.x}px`, top: `${p.y}px`, width: `${p.w}px`, height: `${p.h}px` });
      const old = from?.find((o) => o.id === p.id);
      if (old && old.y !== p.y) {
        const [dur, ...curve] = getComputedStyle(document.documentElement).getPropertyValue('--chrome-slide').trim().split(' ');
        el.animate([{ top: `${old.y}px`, height: `${old.h}px` }, { top: `${p.y}px`, height: `${p.h}px` }],
          { duration: parseFloat(dur) * 1000, easing: curve.join(' ') });
      }
      return el;
    }));
    const split = panes.length === 2;
    document.body.classList.toggle('split', split);
    if (split) {
      const [a, b] = panes;
      Object.assign($('divider').style, { left: `${a.x + a.w}px`, top: `${a.y}px`, width: `${b.x - a.x - a.w}px`, height: `${a.h}px` });
    }
    $('tools').hidden = !activeSplit(); // die Kapsel enthält nur den Knopf „Teilung aufheben“
  }

  // Trennlinie ziehen → Verhältnis der beiden Seiten
  const divider = $('divider');
  let resizeDrag = null, resizeToken = 0;
  window.setResizeSnapshot = async (token, id, source) => {
    const drag = resizeDrag;
    if (!drag || drag.token !== token || drag.ending) return;
    const card = drag.cards.get(id);
    if (!card) return;
    if (source.startsWith('data:image/jpeg;base64,')) {
      const image = new Image(); image.src = source;
      try {
        await image.decode();
        if (resizeDrag !== drag || drag.ending) return;
        card.firstChild.style.backgroundImage = `url("${source}")`;
      } catch { /* Plain material remains usable if capture/decoding fails. */ }
    }
    drag.pending.delete(id);
    if (!drag.pending.size) drag.ready();
  };
  window.finishResizePreview = (token) => {
    const drag = resizeDrag;
    if (!drag || drag.token !== token) return;
    drag.cleanup();
    drag.cards.forEach(card => card.remove());
    resizeDrag = null;
    renderPanes();
  };
  divider.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || resizeDrag || state.panes?.length !== 2) return;
    e.preventDefault();
    e.stopPropagation();
    const [a, b] = state.panes, x0 = a.x, gap = b.x - a.x - a.w, total = b.x + b.w - a.x;
    divider.setPointerCapture(e.pointerId);
    divider.classList.add('dragging');
    const drag = resizeDrag = { token: ++resizeToken, cards: new Map(), pending: new Set([a.id,b.id]), ending: false };
    let frame = 0, ratio = a.w / (total - gap), ready = false;
    for (const p of [a,b]) {
      const tab = state.tabs.find(t => t.id === p.id);
      const card = document.createElement('div'); card.className = 'resize-preview';
      const background = document.createElement('div'); background.className = 'snapshot';
      const identity = document.createElement('div'); identity.className = 'identity';
      identity.innerHTML = svg(tab?.private ? 'private' : 'globe');
      if (!tab?.private && tab?.favicon?.startsWith('data:image/png;base64,')) {
        const icon = new Image(); icon.src = tab.favicon; identity.replaceChildren(icon);
      }
      const title = document.createElement('span'); title.textContent = tab?.title || parse(tab?.url)?.hostname || 'Webseite';
      identity.append(title); card.append(background, identity); document.body.append(card); drag.cards.set(p.id, card);
    }
    const paint = () => {
      frame = 0;
      const left = Math.round((total-gap)*ratio);
      [a,b].forEach((p,i) => Object.assign(drag.cards.get(p.id).style, {
        left: `${i ? x0+left+gap : x0}px`, top: `${p.y}px`, width: `${i ? total-gap-left : left}px`, height: `${p.h}px`
      }));
      divider.style.left = `${x0+left}px`;
    };
    drag.ready = () => {
      if (ready || resizeDrag !== drag || drag.ending) return;
      ready = true; send('split_resize_ready', {token:drag.token});
    };
    const timeout = setTimeout(drag.ready, 800);
    paint();
    send('split_resize_start', {token:drag.token});
    const move = (ev) => {
      ratio = Math.max(.2, Math.min(.8, (ev.clientX - x0 - gap / 2) / (total - gap)));
      if (!frame) frame = requestAnimationFrame(paint);
    };
    drag.cleanup = () => {
      clearTimeout(timeout); cancelAnimationFrame(frame);
      divider.classList.remove('dragging');
      divider.removeEventListener('pointermove', move);
      divider.removeEventListener('pointerup', up);
      divider.removeEventListener('pointercancel', up);
      divider.removeEventListener('lostpointercapture', up);
      window.removeEventListener('blur', up);
      if (divider.hasPointerCapture(e.pointerId)) divider.releasePointerCapture(e.pointerId);
    };
    const up = (ev) => {
      if (drag.ending) return;
      if (ev?.type === 'pointerup') move(ev);
      drag.ending = true; drag.cleanup(); paint();
      send('split_resize_end', {token:drag.token, value:ratio});
    };
    divider.addEventListener('pointermove', move);
    divider.addEventListener('pointerup', up);
    divider.addEventListener('pointercancel', up);
    divider.addEventListener('lostpointercapture', up);
    window.addEventListener('blur', up);
  });
  // Doppelklick in die Lücke: wieder 50 : 50
  divider.addEventListener('dblclick', () => send('split_ratio', { value: 0.5 }));

  // ---------- Leiste oben automatisch ausblenden ----------
  // Nach ein paar Sekunden Ruhe auf einer Webseite verschwindet die Leiste, die Seite reicht dann bis an den Rand
  // (Rust: chrome_hidden). Zurück kommt sie über den oberen Fensterrand, Strg+L/T/Tab oder wenn eine Seite lädt.
  const CHROME_IDLE = 3500, REVEAL_ZONE = 6;
  let chromeHidden = false, chromeTimer = 0, pointerY = null;
  const chromeBusy = () => !activeTab()?.page || document.body.classList.contains('start') || editing()
    || resizeDrag || tabDrag || document.body.matches('.modal, .wheel-open')
    || [suggestBox, favPanel].some((el) => el.classList.contains('open'))
    || (pointerY != null && pointerY < state.chromeHeight); // Maus ruht auf der Leiste
  function setChromeHidden(hidden) {
    if (hidden === chromeHidden) return;
    chromeHidden = hidden;
    document.body.classList.toggle('chrome-hidden', hidden);
    send('chrome_hidden', { value: hidden });
  }
  // Leiste zeigen und den Countdown neu starten; solange etwas offen ist, wird später erneut geprüft
  function showChrome() {
    setChromeHidden(false);
    clearTimeout(chromeTimer);
    chromeTimer = setTimeout(function idle() {
      if (chromeBusy()) chromeTimer = setTimeout(idle, CHROME_IDLE);
      else setChromeHidden(true);
    }, CHROME_IDLE);
  }
  // Mausposition von hoverAt: ausgeblendet reicht der obere Rand, eingeblendet hält jede Bewegung auf der Leiste sie offen
  function chromeHover(y) {
    pointerY = y;
    if (y != null && y < (chromeHidden ? REVEAL_ZONE : state.chromeHeight)) showChrome();
  }
  input.addEventListener('focus', showChrome);
  input.addEventListener('blur', showChrome);

  // ---------- Zustand aus Rust ----------
  window.preparePasswordSuggestions = () => { closeSuggest(); closeFavorites(); };
  window.render = (next) => {
    const switched = next.active !== state.active;
    const opened = switched && !state.tabs.some((t) => t.id === next.active); // gerade neu geöffneter Tab
    const wasLoading = !switched && !!activeTab()?.loading;
    const slideFrom = !!next.chromeHidden !== !!state.chromeHidden ? state.panes : null; // Leiste fährt aus/ein
    state = next;
    if (opened && engine !== ENGINES[0]) { engine = ENGINES[0]; renderEngine(); } // neuer Tab → immer Google
    document.documentElement.style.setProperty('--chrome', `${state.chromeHeight}px`);
    document.body.classList.toggle('multi', !!state.tabbar); // Tabs sichtbar (Rust: sobald etwas offen ist)
    document.body.classList.toggle('inactive', !state.focused);
    const hasPage = !!activeTab()?.page; // Rust meldet, ob der Tab eine Webseite hat (die URL kann leer sein)
    // Ein leerer Tab wird per Knopf umgeschaltet (Rust: "private_tab"), sonst öffnet er einen neuen privaten Tab
    const isPrivate = !!activeTab()?.private, empty = !hasPage && !activeTab()?.url;
    document.body.classList.toggle('private', isPrivate);
    privateBtn.title = empty && isPrivate ? 'Privates Surfen beenden'
      : `${empty ? 'Privat surfen' : 'Neuer privater Tab'} (Strg+Umschalt+N)`;
    document.body.classList.toggle('has-page', hasPage);
    document.body.classList.toggle('home-back', !!activeTab()?.home);
    setStartMode(!hasPage && !activeTab()?.url);
    recordSearches();
    renderTabs();
    renderPanes(slideFrom);
    renderAddress();
    if (switched && !hasPage && !activeTab()?.url) window.focusAddress();
    // Tabwechsel, neuer Tab oder eine Seite beginnt zu laden → Leiste zeigen; Startbildschirm → immer sichtbar
    if (!hasPage) setChromeHidden(false);
    else if (switched || (activeTab()?.loading && !wasLoading)) showChrome();
    // Nach einem Neuladen der Oberfläche kennt Rust womöglich noch den alten Zustand
    if (!!state.chromeHidden !== chromeHidden) send('chrome_hidden', { value: chromeHidden });
  };

  // ---------- Bedienung ----------
  const click = (id, cmd) => $(id).addEventListener('click', () => send(typeof cmd === 'function' ? cmd() : cmd));
  click('btn-new', 'new_tab');
  click('btn-private', 'private_tab');
  click('btn-unsplit', 'unsplit');
  click('btn-back', 'back');
  click('btn-fwd', 'forward');
  click('btn-reload', () => (activeTab()?.loading ? 'stop' : 'reload'));
  click('l-close', 'close');
  click('l-min', 'minimize');
  click('l-zoom', 'maximize');

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    let cmd = null;
    if (e.ctrlKey && !e.altKey) {
      if (k === 'f8' && e.shiftKey) { e.preventDefault(); if (!e.repeat) window.AnimationDebug.toggle(); return; }
      else if (k === 't') cmd = 'new_tab';
      else if (k === 'n' && e.shiftKey) cmd = 'private_tab';
      else if (k === 'w') cmd = 'close_tab';
      else if (k === 'r') cmd = 'reload';
      else if (k === 'tab') cmd = e.shiftKey ? 'prev_tab' : 'next_tab';
      else if (k === 'l') { e.preventDefault(); window.focusAddress(); return; }
    } else if (e.altKey && k === 'arrowleft') cmd = 'back';
    else if (e.altKey && k === 'arrowright') cmd = 'forward';
    else if (k === 'f5') cmd = 'reload';
    if (cmd) { e.preventDefault(); send(cmd); }
  });

  // ---------- Fenster verschieben / Größe ändern ----------
  const EDGE = 6;
  let resizeDir = '';
  function updateResizeCursor(e) {
    let dir = '';
    if (!state.maximized) {
      const v = e.clientY < EDGE ? 'n' : e.clientY > innerHeight - EDGE ? 's' : '';
      const h = e.clientX < EDGE ? 'w' : e.clientX > innerWidth - EDGE ? 'e' : '';
      dir = v + h;
    }
    if (dir !== resizeDir) {
      document.documentElement.className = dir ? `resize-${dir}` : '';
      resizeDir = dir;
    }
  }
  let lastDown = { t: 0, x: 0, y: 0 };
  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (resizeDir) { e.preventDefault(); send('resize', { value: resizeDir }); return; }
    if (!e.target.closest('[data-drag]') || e.target.closest('button, input, form, .tab, .capsule')) return;
    const now = performance.now();
    const isDouble = now - lastDown.t < 400 && Math.hypot(e.clientX - lastDown.x, e.clientY - lastDown.y) < 6;
    lastDown = { t: isDouble ? 0 : now, x: e.clientX, y: e.clientY };
    send(isDouble ? 'maximize' : 'drag');
  });

  window.addEventListener('resize', () => requestAnimationFrame(placeLens));

  // Tabs in der Fenstermitte: Beide Seiten der Leiste reservieren so viel Platz, wie die breitere braucht
  const sides = [...document.querySelectorAll('#toolbar > .side')];
  const contentWidth = (side) => {
    const kids = [...side.children].filter((k) => k.offsetWidth);
    const gap = parseFloat(getComputedStyle(side).columnGap) || 0;
    return kids.reduce((sum, k) => {
      const cs = getComputedStyle(k);
      return sum + k.offsetWidth + parseFloat(cs.marginLeft) + parseFloat(cs.marginRight);
    }, Math.max(0, kids.length - 1) * gap);
  };
  // Wird es eng, gibt zuerst das Adressfeld nach (bis ADDRESS_MIN) – erst danach werden die Tabs schmaler.
  // TAB_WIDTH/TAB_GAP wie .tab und #tabs, TABBAR_EXTRA = „+“ samt Abstand (30 − 10 + 16) und Innenabstand (2 × 10).
  const TAB_WIDTH = 180, TAB_GAP = 4, TABBAR_EXTRA = 56, ADDRESS_MIN = 160, ADDRESS_MAX = 260;
  const toolbar = $('toolbar'), center = document.querySelector('.center');
  let sidesFrame = 0;
  const balanceSides = () => {
    sidesFrame = 0;
    const cs = getComputedStyle(toolbar);
    const inner = toolbar.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2 * parseFloat(cs.columnGap);
    const n = [...$('tabs').querySelectorAll('.tab')].filter((t) => getComputedStyle(t).display !== 'none').length;
    const tabsNeed = document.body.classList.contains('multi') ? n * TAB_WIDTH + Math.max(0, n - 1) * TAB_GAP + TABBAR_EXTRA : 0;
    const fixed = contentWidth(sides[0]) - center.offsetWidth; // linke Seite ohne Adressfeld
    const dock = center.classList.contains('docked') ? parseFloat(getComputedStyle(center).getPropertyValue('--dock-width')) : 0;
    const width = Math.round(Math.max(ADDRESS_MIN, Math.min(ADDRESS_MAX, inner * .2, (inner - tabsNeed) / 2 - fixed - dock)));
    toolbar.style.setProperty('--address-width', `${width}px`);
    const side = Math.max(fixed + width + dock, contentWidth(sides[1]));
    toolbar.style.setProperty('--side', `${Math.ceil(side)}px`);
  };
  const scheduleSides = () => { if (!sidesFrame) sidesFrame = requestAnimationFrame(balanceSides); };
  const sidesObserver = new ResizeObserver(scheduleSides);
  sides.forEach((side) => [...side.children].forEach((k) => sidesObserver.observe(k)));
  addEventListener('resize', scheduleSides);
  balanceSides();
  GlassLens.watch();
  send('ready');
})();
</script>
</body>
</html>
