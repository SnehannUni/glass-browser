<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Glass UI</title>
<style>
  :root {
    --chrome: 42px;   /* kommt als chromeHeight aus main.rs */
    --margin: 4px;    /* = MARGIN in main.rs */
    --pane-radius: 4px; /* = CONTENT_RADIUS in main.rs */
    --label: rgba(255, 255, 255, .97);
    --label-2: rgba(255, 255, 255, .82);
    --label-3: rgba(255, 255, 255, .6);
    --blue: #0a84ff;
    --violet: #bf9dff; /* Kennfarbe für privates Surfen */
    --spring: cubic-bezier(.32, 1.5, .44, 1);
    --ease: cubic-bezier(.25, .8, .25, 1);
    /* Leiste oben aus-/einfahren – Dauer und Kurve wie CHROME_SLIDE in main.rs, sonst laufen Seite und Leiste auseinander */
    --chrome-slide: .38s cubic-bezier(.4, 0, .2, 1);
    --control-hover: rgba(255, 255, 255, .12);
    --control-pressed: rgba(255, 255, 255, .2);
    --address-width: clamp(180px, 20vw, 260px);
    --toolbar-control-height: 30px;
    --toolbar-control-radius: calc(var(--toolbar-control-height) / 2);
    --glass-rim: 1px;
    --glass-outline: .08;
    --glass-highlight: .72;
    --glass-reflection: .22;
    --font: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  /* Fensterecken: genau wie Windows 11 (DWMWCP_ROUND = 8 px), damit Glas und Systemecke deckungsgleich sind.
     Beim Maximieren wird --radius auf 0 gesetzt. */
  html { --radius: 8px; clip-path: inset(0 round var(--radius)); }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 100; pointer-events: none;
    border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, .38);
  }
  body.seamless::after { display: none; }
  body.inactive::after { border-color: rgba(255, 255, 255, .22); }
  [hidden] { display: none !important; } /* sonst überschreibt z. B. .key { display: grid } das Attribut */
  html, body {
    height: 100%; overflow: hidden; background: transparent; color: var(--label);
    font: 13px/1.25 var(--font); letter-spacing: -.01em;
    user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .45); /* lesbar auf hellem Wallpaper, ohne Flächen-Tönung */
  }
  /* Liegt unter einer Glasfläche sehr heller Hintergrund, schaltet updateInk() sie auf dunkle Schrift um */
  .ink-dark {
    --label: rgba(14, 16, 24, .94); --label-2: rgba(14, 16, 24, .76); --label-3: rgba(14, 16, 24, .56);
    text-shadow: 0 1px 2px rgba(255, 255, 255, .35);
  }
  .ink-dark svg { filter: drop-shadow(0 1px 1px rgba(255, 255, 255, .3)); }
  /* Adressfeld in dunkler Leiste über hellem Grund – oder umgekehrt: eigene Wahl statt der geerbten */
  .ink-light {
    --label: rgba(255, 255, 255, .97); --label-2: rgba(255, 255, 255, .82); --label-3: rgba(255, 255, 255, .6);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
  /* line-height: normal – sonst schneidet das Feld die Unterlängen (g, p, y) ab */
  input { font: inherit; line-height: normal; color: inherit; background: none; border: 0; outline: none; min-width: 0; user-select: text; }
  /* Markierter Text wie mattes Glas statt Windows-Blau */
  input::selection { background: rgba(255, 255, 255, .24); color: var(--label); }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75;
        stroke-linecap: round; stroke-linejoin: round; flex: none; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .3)); }

  /* ---------- Fenstermaterial: Wallpaper hinter dem Fenster, wie bei macOS ---------- */
  /* Einmal verschwommen vorgerendert; beim Verschieben nur noch ein GPU-Transform */
  #wall {
    position: fixed; left: 0; top: 0; z-index: -3; pointer-events: none;
    will-change: transform; opacity: 0; transition: opacity .6s var(--ease);
  }
  #wall.ready { opacity: 1; }

  /* ---------- Liquid Glass ---------- */
  .glass {
    position: relative; isolation: isolate;
    background: linear-gradient(180deg, rgba(255, 255, 255, var(--glass-fill-top, .065)), rgba(255, 255, 255, var(--glass-fill-bottom, .025)));
    /* Ohne JS-Linse; GlassLens (glass-lens.js) ersetzt das durch Lichtbrechung + Blur */
    backdrop-filter: blur(6px) saturate(1.5) brightness(var(--glass-brightness, .82));
    box-shadow:
      inset 0 -10px 18px -14px rgba(255, 255, 255, .08),
      0 6px 20px -6px rgba(0, 0, 0, .28),
      0 1px 3px rgba(0, 0, 0, .16);
    transition: transform .5s var(--spring), background .3s;
  }
  /* Eine Vektorkontur mit Lichtverlauf in CSS-Pixeln entlang ihres Umfangs. */
  .glass > svg.glass-rim {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    fill: none; stroke: none; filter: none; overflow: visible;
    opacity: var(--rim-window-active, 1);
    transition: opacity .2s var(--ease);
  }
  .glass-outline { stroke-opacity: var(--glass-outline); }
  .glass-highlights { opacity: var(--rim-proximity, 0); transition: opacity .2s var(--ease); }
  body.inactive .glass > svg.glass-rim { --rim-window-active: .4; }
  @media (prefers-contrast: more) {
    .glass { outline: 1px solid var(--label-2); outline-offset: -1px; }
  }

  .capsule { height: var(--toolbar-control-height); border-radius: var(--toolbar-control-radius); display: flex; align-items: center; }

  /* Gemeinsame Interaktion für alle Symboltasten – ohne Skalierung der SVGs. */
  :is(.key, .tab-new, .close) {
    transition: opacity .18s var(--ease), background-color .18s var(--ease), color .18s var(--ease);
  }
  :is(.key, .tab-new, .close):is(:hover, .vh) { background-color: var(--control-hover); }
  :is(.key, .tab-new, .close):active { background-color: var(--control-pressed); }
  :is(.key, .tab-new, .close):focus-visible { outline: 2px solid var(--label); outline-offset: -2px; }
  .key {
    position: relative; height: 26px; min-width: 32px; border-radius: 13px;
    display: grid; place-items: center; color: var(--label);
  }
  .key:disabled { color: var(--label-3); background: none; transform: none; }

  /* ---------- Toolbar ---------- */
  #toolbar {
    --glass-fill-top: .12; --glass-fill-bottom: .065; --glass-brightness: .94;
    /* --side (aus balanceSides im Skript): beide Seiten mindestens so breit wie die breitere – sonst gäbe bei vielen
       Tabs nur die schmale rechte Seite nach, und die Tabs rutschten aus der Mitte */
    height: 42px; display: grid; grid-template-columns: minmax(var(--side, auto), 1fr) minmax(0, auto) minmax(var(--side, auto), 1fr);
    align-items: center; gap: 10px; padding: 0 12px 0 16px;
    transition: transform var(--chrome-slide), opacity var(--chrome-slide);
  }
  /* Ausgeblendet schiebt die Webseite die Leiste nach oben weg (42 − 4 px Rand) – ihre Unterkante bleibt an der Seite */
  body.chrome-hidden #toolbar { transform: translateY(-38px); opacity: 0; }
  /* Eine Zeile in drei Teilen: links Ampel, Vor/Zurück und der aktive Tab (= Adressfeld), in der Mitte die übrigen Tabs, rechts Knöpfe.
     Die beiden Seiten sind gleich breit – so stehen die Tabs in der Fenstermitte, solange sie Platz haben. */
  /* kein min-width: 0 – die Seiten behalten ihren Platz, schrumpfen müssen die Tabs */
  .side { display: flex; align-items: center; gap: 10px; align-self: stretch; }
  .side.left { grid-column: 1; justify-content: flex-start; }
  #tabbar { grid-column: 2; }
  .side.right { grid-column: 3; justify-content: flex-end; }

  .lights { display: flex; gap: 8px; margin-right: 6px; }
  .light { width: 12px; height: 24px; display: grid; place-items: center; }
  .light i {
    width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center;
    box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .28), inset 0 1px 1px rgba(255, 255, 255, .25);
    transition: background-color .3s, transform .3s var(--spring);
  }
  .light svg { width: 8px; height: 8px; stroke: rgba(0, 0, 0, .62); stroke-width: 1.5; opacity: 0; transition: opacity .12s; }
  .lights:is(:hover, .vh) .light svg { opacity: 1; }
  .light:active i { transform: scale(.9); filter: brightness(.85); }
  #l-close i { background: #ff5f57; }
  #l-min i { background: #febc2e; }
  #l-zoom i { background: #28c840; }
  body.inactive .lights:not(:is(:hover, .vh)) .light i { background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .08); }

  /* Vor/Zurück gibt es nur, wenn im Tab eine Seite offen ist */
  .nav { padding: 0 5px; gap: 0; animation: pop-in .5s var(--spring); }
  :is(.nav, .tools) > .key { width: 24px; min-width: 24px; height: 24px; }
  [data-button-group]::before {
    content: ''; position: absolute; left: 0; top: 0; pointer-events: none;
    width: var(--group-width, 28px); height: var(--group-height, 24px); border-radius: 12px;
    transform: translate(var(--group-x, 3px), var(--group-y, 3px));
    background: var(--control-hover); opacity: 0;
    transition: transform 110ms ease-out, width 110ms ease-out, opacity 80ms ease-out;
  }
  [data-button-group].group-hover-on::before { opacity: 1; }
  [data-button-group].group-hover-pressed::before { background: var(--control-pressed); }
  [data-button-group].group-hover-instant::before { transition: none; }
  :is(.nav, .tools) > .key:is(:hover, .vh, :active),
  body:not(.start) .address:not(.editing) > .key:is(:hover, .vh, :active) { background: transparent; }
  body.start #address::before, #address.editing::before { display: none; }
  @media (prefers-reduced-motion: reduce) { [data-button-group]::before { transition: none; } }
  body.start .nav { display: none; }
  /* Ganz zurück auf den Startbildschirm gegangen: „Vor“ führt wieder zur Seite */
  body.start.home-back .nav { display: flex; }
  @keyframes pop-in { from { opacity: 0; transform: scale(.6); } }

  /* Platzhalter in der Leiste: so breit wie die eingefahrene Kapsel, damit ausgefahren nichts verrutscht */
  .center { position: relative; width: var(--address-width); align-self: stretch; }
  /* In der Leiste eingefahren: der aktive Tab mit Favicon, Titel, Stern und Neu laden.
     Ein Klick fährt das Feld nach rechts über die Tabs aus. */
  .address {
    position: absolute; left: 0; top: calc(50% - var(--toolbar-control-radius)); z-index: 5;
    width: var(--address-width); padding: 0 5px; gap: 0; cursor: pointer;
    transition: width .5s var(--spring), padding .3s var(--ease), gap .3s var(--ease);
  }
  .address.editing {
    width: clamp(280px, 42vw, 580px); padding: 0 3px; gap: 8px; cursor: text;
    background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .08));
  }
  /* Werbeblocker-Schild gibt es nur im ausgefahrenen Feld */
  .address:not(.editing) #btn-shield { display: none; }
  body:not(.start) .address:not(.editing) #addr-input { position: absolute; width: 0; pointer-events: none; }
  /* Eingefahren steht der Tab an Stelle von Lupe und Eingabe; beim Suchen und auf dem Startbildschirm umgekehrt */
  body:not(.start) .address:not(.editing) #addr-search, body.start #addr-tab, .address.editing #addr-tab { display: none; }
  #addr-tab { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 7px; }
  #addr-tab .title { flex: 1; min-width: 0; color: var(--label); }
  #addr-tab.swap > :not(.close) { animation: slot-in .45s var(--spring); }
  @keyframes slot-in { from { opacity: 0; transform: translateX(10px); } }
  /* Schließen liegt über dem Favicon (wie bei den Tabs: beim Drüberfahren) */
  #addr-close { left: 8px; }
  #addr-tab:is(:hover, .vh) .close { opacity: 1; }
  #addr-tab:is(:hover, .vh) .fav { opacity: 0; }
  #addr-tab .fav { transition: opacity .18s var(--ease); }
  body.private #addr-tab .fav { color: var(--violet); }
  /* Herausziehen: der Tab löst sich wie ein Tab aus der Leiste vom Feld */
  #addr-tab.dragging {
    position: relative; z-index: 30; border-radius: var(--toolbar-control-radius); color: var(--label);
    background-color: rgba(255, 255, 255, .16); box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  }
  /* Solange gesucht wird, treten die Tabs zurück – das Feld liegt über ihnen */
  #tabbar { transition: opacity .25s var(--ease); }
  body.searching #tabbar { opacity: 0; pointer-events: none; }
  /* Startbildschirm: das Adressfeld wandert als große Such-Kapsel in die Fenstermitte */
  body.start .address {
    position: fixed; left: 0; right: 0; margin: 0 auto; top: calc(42vh - 34px);
    width: min(760px, calc(100vw - 64px)); height: 68px; border-radius: 34px;
    padding: 0 11px 0 26px; gap: 14px; font-size: 19px; z-index: 10; cursor: text; transition: none;
  }
  body.start .address .ic { width: 21px; height: 21px; }
  /* Startbildschirm: Platzhalter steht immer dort, wo getippt wird – beim Klick springt nichts */
  /* Boxen sind zentriert; die Segoe-Schrift braucht optisch 1 px Ausgleich zur Lupe. */
  body.start .address #addr-input { opacity: 1; transform: translateY(-1px); }
  .address .ic { color: var(--label-2); width: 14px; height: 14px; flex: none; transition: color .2s; }
  #addr-search { flex: none; min-width: 28px; height: 24px; }
  #addr-search:is(:hover, .vh) .ic { color: var(--label); }
  body.start #addr-search { width: 46px; height: 46px; border-radius: 50%; margin-left: -12px; }
  #addr-input { flex: 1; width: 0; height: 100%; opacity: 0; transition: opacity .2s; }
  #addr-input::placeholder { color: var(--label-2); }
  .address.editing #addr-input { opacity: 1; }
  #btn-reload { min-width: 28px; height: 24px; color: var(--label-2); }
  body:not(.start) .address:not(.editing) :is(#btn-star, #btn-reload) { width: 24px; min-width: 24px; height: 24px; flex: none; }
  /* Suchanbieter: nur auf dem Startbildschirm, Logo rechts im Feld – ein Klick öffnet das Anbieter-Rad.
     In der Leiste gibt es keine Auswahl, dort sucht immer Google (searchEngine im Skript). */
  .engine {
    width: 26px; height: 26px; min-width: 26px; padding: 0; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255, 255, 255, .12); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .22), 0 1px 3px rgba(0, 0, 0, .18);
  }
  .engine img { width: 15px; height: 15px; border-radius: 3px; }
  .engine:is(:hover, .vh) { background: rgba(255, 255, 255, .2); }
  body:not(.start) #btn-engine { display: none; }
  body.start .engine { width: 46px; height: 46px; }
  body.start .engine img { width: 24px; height: 24px; border-radius: 5px; }
  /* Startbildschirm: Aus dem Logo klappt ein Kreis aus Anbietern nach rechts auf, jeder in seiner eigenen
     Glaskugel. Der gewählte sitzt links an der Stelle des Knopfs; wählt man einen anderen, dreht er sich dorthin. */
  #wheel {
    --slot: 46px; --orbit: 78px; --rot: 0deg; /* --orbit = WHEEL_ORBIT im Skript */
    position: fixed; z-index: 11; width: calc(2 * var(--orbit) + var(--slot) + 10px); aspect-ratio: 1;
    display: none; pointer-events: none;
  }
  #wheel.open { display: block; }
  body.wheel-open #btn-engine { opacity: 0; }
  /* Knopf und oberster Kreis blenden weich ineinander über (siehe openWheel/closeWheel) */
  body.start #btn-engine { transition: transform .45s var(--spring), background-color .2s, opacity .18s; }
  #wheel .spin { position: absolute; inset: 0; transform: rotate(var(--rot)); transition: transform .7s var(--spring); }
  @property --off { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @property --travel-scale { syntax: "<number>"; inherits: false; initial-value: 1; }
  @property --arrival-scale { syntax: "<number>"; inherits: true; initial-value: 1; }
  #wheel .slot {
    position: absolute; left: 50%; top: 50%; width: var(--slot); height: var(--slot); margin: calc(var(--slot) / -2);
    border-radius: 50%; display: grid; place-items: center; pointer-events: auto;
    /* auf die Umlaufbahn setzen (Platz 0 links, --off = Aus-/Eindrehen), dann zurückdrehen: die Logos bleiben aufrecht */
    transform: rotate(calc(var(--a) - 90deg + var(--off))) translateY(calc(-1 * var(--orbit))) rotate(calc(90deg - var(--a) - var(--off) - var(--rot))) scale(calc(var(--arrival-scale) * var(--travel-scale)));
    transition: transform .7s var(--spring), background-color .2s;
    /* ohne Schlagschatten: gestapelt würden sich die Schatten aufaddieren */
    box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .14), inset 0 -10px 18px -12px rgba(255, 255, 255, .16);
  }
  /* Stapel: der gewählte liegt obenauf, darunter die übrigen – je weiter weg, desto tiefer (z-index aus turnWheel) */
  #wheel .slot.on { background-color: rgba(255, 255, 255, .22); }
  #wheel.instant :is(.spin, .slot) { transition: none; }
  #wheel .slot img { scale: calc(1 / var(--arrival-scale)); width: 24px; height: 24px; border-radius: 5px; transition: transform .45s var(--spring); }
  #wheel .slot:is(:hover, .vh):not(.on) { background-color: rgba(255, 255, 255, .14); }
  #wheel .slot:active img { transform: scale(1.15); }
  /* Werbeblocker: Schild + Anzahl blockierter Anfragen; ausgeschaltet durchgestrichen und blass */
  .shield { height: 24px; min-width: 28px; padding: 0 7px; display: flex; gap: 4px; color: var(--label-2); font-size: 11px;
            font-variant-numeric: tabular-nums; }
  .shield svg { width: 14px; height: 14px; }
  .shield:is(:hover, .vh) { color: var(--label); }
  .shield.off { color: var(--label-3); }
  #btn-reload:is(:hover, .vh) { color: var(--label); }
  .progress {
    position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px; border-radius: 2px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    background-size: 35% 100%; background-repeat: no-repeat; opacity: 0; transition: opacity .3s;
  }
  .loading .progress { opacity: 1; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { from { background-position: -35% 0; } to { background-position: 135% 0; } }

  .tools { padding: 0 5px; }

  /* ---------- Tab-Leiste ---------- */
  /* Sobald etwas offen ist: Tabs mittig in der einen Zeile, „+“ direkt dahinter */
  #tabbar { height: 100%; min-width: 0; padding: 0 10px; display: none; align-items: center; justify-content: center; gap: 16px; }
  body.multi #tabbar { display: flex; }
  /* Tabs nur so breit wie nötig; wird es eng, schrumpfen sie (bis zum Kompaktmodus) */
  #tabs { position: relative; flex: 0 1 auto; min-width: 0; height: var(--toolbar-control-height); display: flex; gap: 4px; }
  .tab-new {
    width: var(--toolbar-control-height); height: var(--toolbar-control-height); margin-left: -10px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
  }
  .tab-new svg { width: 14px; height: 14px; }
  /* Nur ein Tab offen: „+“ steht direkt neben dem Adressfeld (placeNewTab) und tritt beim Suchen zurück */
  .side.left > #btn-new { margin-left: -4px; }
  body.searching .side.left > #btn-new { opacity: 0; pointer-events: none; }
  #lens {
    position: absolute; top: 0; left: 0; height: var(--toolbar-control-height); width: 0; pointer-events: none;
    transition: transform .6s var(--spring), width .6s var(--spring);
  }
  #lens.instant { transition: none; }
  /* Der aktive Tab steht links im Adressfeld (renderTabList: .in-slot). Ein geteiltes Paar bleibt als Einheit
     unter der Linse in der Leiste – so lässt es sich wie gewohnt tauschen und wieder trennen. */
  #lens.off { opacity: 0; }
  .tab.in-slot { display: none; }
  #lens .glass { position: absolute; inset: 0; border-radius: var(--toolbar-control-radius); }
  #lens.squish .glass { animation: squish .6s var(--spring); }
  @keyframes squish { 30% { transform: scale(1.06, .82); } }

  .tab {
    /* feste Breite statt flex-basis: die Tab-Leiste ist nur so breit wie ihr Inhalt, und Chromium misst dafür
       die Inhaltsbreite – mit flex-basis würden kurze Titel den Tab auf „nur ✕“ (Kompaktmodus) schrumpfen */
    position: relative; z-index: 1; width: 180px; flex: 0 1 auto; min-width: 34px; height: var(--toolbar-control-height); border-radius: var(--toolbar-control-radius);
    display: flex; align-items: center; justify-content: center; color: var(--label-2);
    transition: color .25s, background-color .2s;
    animation: tab-in .5s var(--spring);
  }
  .tab:is(:hover, .vh):not(.active) { background-color: rgba(255, 255, 255, .05); }
  .tab.active { color: var(--label); }
  @keyframes tab-in { from { opacity: 0; } }
  .tab-label { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 0 30px; }
  .title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fav { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--label-2); }
  .fav img { width: 16px; height: 16px; border-radius: 4px; }
  .fav svg { width: 14px; height: 14px; }
  .spinner {
    width: 13px; height: 13px; border-radius: 50%;
    background: conic-gradient(transparent 15%, var(--label));
    -webkit-mask: radial-gradient(circle, transparent 4px, #000 4.6px);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(1turn); } }
  .close {
    position: absolute; left: 3px; top: 3px; width: calc(var(--toolbar-control-height) - 6px); height: calc(var(--toolbar-control-height) - 6px); border-radius: 50%;
    display: grid; place-items: center; color: var(--label-2);
    opacity: 0;
  }
  .close svg { width: 10px; height: 10px; stroke-width: 2; }
  .tab:is(:hover, .vh, :focus-within) .close { opacity: 1; }
  .close:is(:hover, .vh) { color: var(--label); }
  .tab.compact .tab-label { padding: 0; }
  .tab.compact .title, .tab.compact:not(.active) .close { display: none; }
  .tab.compact.active .fav { display: none; }
  .tab.compact .close { position: static; opacity: 1; }

  /* ---------- Inhalt ---------- */
  #stage {
    position: fixed; top: var(--chrome); left: var(--margin); right: var(--margin); bottom: var(--margin);
    border-radius: var(--pane-radius); pointer-events: none; /* nur Platzhalter für die Webseite, darf keine Klicks schlucken */
  }

  /* ---------- Sichtbare Webseiten & geteilte Ansicht ---------- */
  .pane {
    position: fixed; border-radius: var(--pane-radius); pointer-events: none; transition: box-shadow .3s;
    box-shadow: 0 0 0 .5px rgba(255, 255, 255, .1), 0 12px 40px rgba(0, 0, 0, .45);
  }
  /* Die Seite, zu der Adresszeile & Co. gerade gehören */
  body.split .pane.focus { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5), 0 12px 40px rgba(0, 0, 0, .45); }
  /* Die Lücke zwischen den Seiten ist selbst der Griff (ohne sichtbaren Balken) */
  #divider { position: fixed; z-index: 5; display: none; cursor: col-resize; }
  body.split #divider { display: block; }
  .resize-preview { position: fixed; z-index: 4; overflow: hidden; border-radius: var(--pane-radius); background: #26303e; pointer-events: none; }
  .resize-preview > .snapshot { position: absolute; inset: -45px; background-position: center; background-size: cover; filter: blur(30px) brightness(.55); }
  .resize-preview > .identity { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; color: white; text-align: center; }
  .resize-preview .identity img, .resize-preview .identity svg { width: 40px; height: 40px; flex: none; }
  .resize-preview .identity span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; font-weight: 600; }
  #dropzone { position: fixed; z-index: 15; display: none; border-radius: var(--pane-radius); pointer-events: none; }
  #dropzone.show { display: block; animation: pop-in .35s var(--spring); }
  .tab.dragging {
    z-index: 30; transition: none; animation: none; color: var(--label);
    background-color: rgba(255, 255, 255, .16); box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  }
  /* Ablegen auf einem Tab: helle Kante auf der Seite, auf die der gezogene Tab kommt */
  :is(.tab, #address).drop-left, :is(.tab, #address).drop-right { background-color: rgba(255, 255, 255, .14) !important; color: var(--label); }
  :is(.tab, #address).drop-left { box-shadow: inset 3px 0 0 rgba(255, 255, 255, .75); }
  :is(.tab, #address).drop-right { box-shadow: inset -3px 0 0 rgba(255, 255, 255, .75); }
  /* Geteilten Tab auf freie Stelle ziehen = lösen: die Linse über beiden Tabs zieht sich zurück */
  body.drop-unsplit #lens { opacity: .35; }
  .tab.paired { color: var(--label); }
  /* Kombiniertes Paar, während ein anderer Tab aktiv ist: eine gemeinsame Kapsel mit Trennlinie */
  .tab:is(.pair-left, .pair-right) {
    background-image: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .045));
  }
  .tab.pair-left { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tab.pair-right { margin-left: -4px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .tab.pair-right::before {
    content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 1px; background: rgba(255, 255, 255, .18);
  }
  /* Partner einer geteilten Ansicht: Das Adressfeld wird um ihn breiter, er liegt rechts in derselben Kapsel */
  .center { --dock-width: 150px; }
  .center.docked { width: calc(var(--address-width) + var(--dock-width)); }
  .center.docked .address:not(.editing) { width: calc(var(--address-width) + var(--dock-width)); padding-right: calc(var(--dock-width) + 5px); }
  .tab.docked {
    position: absolute; right: 0; top: calc(50% - var(--toolbar-control-radius)); z-index: 6; width: var(--dock-width);
    animation: none; transition: color .25s, background-color .2s, opacity .25s var(--ease);
  }
  /* feine Trennlinie zwischen den beiden Hälften */
  .tab.docked::before {
    content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 1px; background: rgba(255, 255, 255, .18);
  }
  .tab.docked .tab-label { padding: 0 14px 0 30px; }
  body.searching .tab.docked { opacity: 0; pointer-events: none; }
  body.tab-dragging, body.tab-dragging * { cursor: grabbing !important; }

  /* ---------- Suchvorschläge ---------- */
  #suggest {
    position: fixed; z-index: 20; display: none; padding: 6px; border-radius: 18px;
    /* gleiches Glas wie überall, aber stärker verwischt (ohne Linse), damit viel Text ruhig lesbar bleibt */
    backdrop-filter: blur(20px) saturate(1.4) brightness(.8);
  }
  #suggest.open { display: block; animation: drop-in .4s var(--spring); }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
  .sg {
    display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 8px; border-radius: 12px;
    color: var(--label-2); white-space: nowrap; overflow: hidden;
  }
  .sg b { color: var(--label); font-weight: 600; }
  .sg.sel { background: rgba(255, 255, 255, .12); }
  .sg:is(:hover, .vh):not(.sel) { background: rgba(255, 255, 255, .06); }
  .sg svg { width: 14px; height: 14px; color: var(--label-3); }
  .sg > svg:first-child { width: 18px; height: 18px; }
  .sg-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sg-head { padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: var(--label-3); letter-spacing: .02em; }
  .sg-head:first-child { padding-top: 4px; }
  /* ---------- Favoriten ---------- */
  /* Stern rechts in der Adresszeile, neben Neu laden */
  .star { color: var(--label-2); }
  .star:is(:hover, .vh) { color: var(--label); }
  .star.on { color: #ffd60a; }
  .star.pop svg { animation: star-pop .5s var(--spring); }
  @keyframes star-pop { 40% { transform: scale(1.45) rotate(-12deg); } }
  /* Knopf ganz rechts oben */
  .fav-btn { margin-left: -4px; } /* rückt etwas an den Privat-Knopf */
  .fav-btn.open { background-image: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .1)); }
  /* Ausklappende Liste der Favoriten */
  #favs {
    position: fixed; z-index: 20; display: none; width: 320px; max-height: 60vh; overflow-y: auto;
    padding: 6px; border-radius: 18px; backdrop-filter: blur(20px) saturate(1.4) brightness(.8);
  }
  #favs.open { display: block; animation: drop-in .4s var(--spring); transform-origin: top right; }

  /* ---------- Update-Modal ---------- */
  #update {
    position: fixed; z-index: 30; left: 50%; top: 50%; width: 360px; margin: -110px 0 0 -180px;
    display: none; padding: 18px 18px 14px; border-radius: 22px;
    /* dichter als die übrigen Gläser: der Text dahinter (z. B. die Such-Kapsel) darf nicht durchscheinen */
    background: linear-gradient(180deg, rgba(40, 42, 54, .78), rgba(26, 28, 38, .82));
    backdrop-filter: blur(30px) saturate(1.4) brightness(.7);
  }
  #update.open { display: block; animation: pop-in .5s var(--spring); }
  /* Abdunkeln hinter dem Modal (nur die Oberfläche – eine Webseite ist ein eigenes Fenster) */
  #scrim {
    position: fixed; inset: 0; z-index: 29; display: none; pointer-events: none;
    background: rgba(0, 0, 0, .3); backdrop-filter: blur(3px);
  }
  body.modal #scrim { display: block; animation: fade-in .3s var(--ease); }
  @keyframes fade-in { from { opacity: 0; } }
  .up-head { display: flex; gap: 12px; align-items: center; }
  .up-head > svg {
    width: 36px; height: 36px; padding: 8px; border-radius: 12px; flex: none; color: #fff;
    background: linear-gradient(180deg, #4ea3ff, #1f6fe8); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
  }
  #up-title { font-size: 15px; font-weight: 600; }
  #up-version { margin-top: 2px; color: var(--label-2); font-size: 12px; }
  #up-notes {
    margin: 14px 0 0; max-height: 110px; overflow-y: auto; white-space: pre-line; line-height: 1.45;
    color: var(--label-2); font-size: 12.5px;
  }
  #up-notes:empty { display: none; }
  #up-error { margin-top: 10px; color: #ff8a80; font-size: 12.5px; line-height: 1.4; }
  #up-error:empty { display: none; }
  .up-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .up-btn {
    height: 30px; padding: 0 14px; border-radius: 15px; font-weight: 600; font-size: 12.5px;
    background: rgba(255, 255, 255, .1); transition: background-color .2s, transform .45s var(--spring);
  }
  .up-btn:is(:hover, .vh) { background: rgba(255, 255, 255, .18); }
  .up-btn:active { transform: scale(1.06); transition-duration: .12s; }
  .up-btn.primary { background: linear-gradient(180deg, #4ea3ff, #1f6fe8); color: #fff; }
  .up-btn.primary:is(:hover, .vh) { background: linear-gradient(180deg, #62afff, #2a7af0); }
  .up-btn:disabled { opacity: .6; transform: none; }
  .up-btn .spinner { display: inline-block; vertical-align: -2px; margin-right: 7px; width: 12px; height: 12px; }
  .fv-head { padding: 6px 10px 6px; font-size: 11px; font-weight: 600; color: var(--label-3); letter-spacing: .02em; }
  .fv { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 8px 0 10px; border-radius: 12px; }
  .fv:is(:hover, .vh) { background: rgba(255, 255, 255, .1); }
  .fv-ic { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--label-2); }
  .fv-ic img { width: 16px; height: 16px; border-radius: 4px; }
  .fv-ic svg { width: 14px; height: 14px; }
  .fv-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fv-title, .fv-host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fv-host { font-size: 11px; color: var(--label-3); }
  .fv-empty { padding: 12px 10px 14px; color: var(--label-2); line-height: 1.45; }

  /* Eintrag aus Verlauf oder Favoriten löschen */
  .rm {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none;
    color: var(--label-2); opacity: 0; transition: opacity .15s, background-color .15s;
  }
  .rm svg { width: 10px; height: 10px; stroke-width: 2; color: inherit; }
  .sg:is(:hover, .vh) .rm, .sg.sel .rm, .fv:is(:hover, .vh) .rm { opacity: .75; }
  .rm:is(:hover, .vh) { opacity: 1 !important; background: rgba(255, 255, 255, .14); }
  body.start .sg { height: 44px; font-size: 16px; padding: 0 12px; }
  body.start .sg > svg:first-child { width: 20px; height: 20px; }
  body.start .sg-head { padding-left: 20px; }

  /* ---------- Privates Surfen ---------- */
  .private-btn { margin-left: 0; } /* nicht wie „+“ an den Nachbarn heranrücken */
  /* Nur auf dem Startbildschirm; auf einer Seite öffnet Strg+Umschalt+N einen privaten Tab */
  body:not(.start) .private-btn { display: none; }
  .private-btn svg { width: 15px; height: 15px; }
  /* Aktiver Tab ist privat: Knopf leuchtet, Adressfeld und Tab bekommen einen violetten Schimmer */
  body.private .private-btn { color: var(--violet); background-image: linear-gradient(180deg, rgba(175, 130, 255, .3), rgba(130, 90, 255, .14)); }
  body.private .address { background: linear-gradient(180deg, rgba(160, 120, 255, .24), rgba(110, 70, 230, .12)); }
  body.private .address.editing { background: linear-gradient(180deg, rgba(175, 135, 255, .32), rgba(120, 80, 240, .18)); }
  .tab.private .fav { color: var(--violet); }
  .tab.private.active { color: #e4d9ff; }
  /* Startbildschirm: Hinweis über der Such-Kapsel */
  #private-note {
    position: fixed; left: 0; right: 0; top: calc(42vh - 34px - 76px); margin: 0 auto;
    width: min(760px, calc(100vw - 64px)); display: none; flex-direction: column; align-items: center; gap: 6px;
    text-align: center; color: var(--label-2); line-height: 1.4; pointer-events: none;
  }
  #private-note b { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; color: var(--violet); }
  #private-note b svg { width: 20px; height: 20px; }
  body.start.private #private-note { display: flex; animation: pop-in .5s var(--spring); }


  html.resize-n, html.resize-s { cursor: ns-resize; }
  html.resize-e, html.resize-w { cursor: ew-resize; }
  html.resize-ne, html.resize-sw { cursor: nesw-resize; }
  html.resize-nw, html.resize-se { cursor: nwse-resize; }
  html[class*="resize-"] * { cursor: inherit !important; }
</style>
</head>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const send = (cmd, extra = {}) => window.ipc.postMessage(JSON.stringify({ cmd, ...extra }));

  const ICON = {
    reload: '<path d="M13.2 8a5.2 5.2 0 1 1-1.52-3.68"/><path d="M13.2 2.6v3h-3"/>',
    stop: '<path d="m4.5 4.5 7 7m0-7-7 7"/>',
    lock: '<rect x="3.8" y="7.2" width="8.4" height="6.3" rx="1.7" fill="currentColor" stroke="none"/><path d="M5.6 7.2V5.4a2.4 2.4 0 0 1 4.8 0v1.8"/>',
    search: '<circle cx="7" cy="7" r="4.5"/><path d="m10.4 10.4 3.2 3.2"/>',
    globe: '<circle cx="8" cy="8" r="5.6"/><path d="M2.4 8h11.2M8 2.4c1.6 1.7 2.4 3.6 2.4 5.6S9.6 11.9 8 13.6C6.4 11.9 5.6 10 5.6 8S6.4 4.1 8 2.4z"/>',
    close: '<path d="m4 4 8 8m0-8-8 8"/>',
    private: '<path d="M1.6 7.4h12.8M3.2 7.4l1.1-3.9c.1-.4.6-.6 1-.4L8 4l2.7-.9c.4-.2.9 0 1 .4l1.1 3.9"/><circle cx="4.9" cy="11" r="2"/><circle cx="11.1" cy="11" r="2"/><path d="M6.9 11c.7-.5 1.5-.5 2.2 0"/>',
    clock: '<circle cx="8" cy="8" r="5.6"/><path d="M8 5v3.2l2.1 1.4"/>',
    star: '<path d="m8 2 1.8 3.8 4.1.5-3 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1-3-2.9 4.1-.5z"/>',
    shield: '<path d="M8 1.9 13 3.8v3.9c0 3-2.1 5.4-5 6.4-2.9-1-5-3.4-5-6.4V3.8z"/><path d="m5.7 8 1.6 1.6 3-3.2"/>',
    shieldOff: '<path d="M8 1.9 13 3.8v3.9c0 3-2.1 5.4-5 6.4-2.9-1-5-3.4-5-6.4V3.8z"/><path d="m2.5 2.5 11 11"/>',
    chev: '<path d="m4.5 6.5 3.5 3.5 3.5-3.5"/>',
    check: '<path d="m3.5 8.5 3 3 6-7"/>',
    starFill: '<path d="m8 2 1.8 3.8 4.1.5-3 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1-3-2.9 4.1-.5z" fill="currentColor"/>',
  };
  const svg = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 16 16">${ICON[name]}</svg>`;


  let state = { tabs: [], active: null, maximized: false, focused: true, chromeHeight: 42 };
  let lastActive = null;
  const tabEls = new Map();

  const activeTab = () => state.tabs.find((t) => t.id === state.active);
  const parse = (url) => { try { return new URL(url); } catch { return null; } };
  const hostOf = (url) => parse(url)?.hostname.replace(/^www\./, '') || '';

  // ---------- Licht: die Glanzkanten richten sich zum Mauszeiger aus ----------
  let pointer = null, lightFrame = 0;
  function trackLight(x, y) {
    if (x == null || y == null) {
      pointer = null;
      window.GlassRim.leave();
      return;
    }
    pointer = { x, y };
    if (!lightFrame) lightFrame = requestAnimationFrame(updateLight);
  }
  document.addEventListener('pointermove', (e) => {
    trackLight(e.clientX, e.clientY);
    updateResizeCursor(e);
  });
  function updateLight() {
    lightFrame = 0;
    if (!pointer) return;
    for (const el of document.querySelectorAll('.glass')) {
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      const dx = pointer.x - (r.left + r.width / 2), dy = pointer.y - (r.top + r.height / 2);
      const len = Math.hypot(dx, dy) || 1;
      el.style.setProperty('--lx', (-dx / len).toFixed(3));
      el.style.setProperty('--ly', (-dy / len).toFixed(3));
      window.GlassRim.move(el, pointer.x, pointer.y);
    }
  }

  // ---------- Wallpaper hinter dem Glas ----------
  const wall = $('wall');
  const wallImg = new Image();
  let geo = null, bakedFor = '';
  wallImg.onload = () => { bakeWall(); placeWall(); };
  wallImg.src = '/wallpaper';

  // Wallpaper einmal in Monitorgröße verschwommen in ein Canvas zeichnen ("Füllen" wie der Desktop)
  function bakeWall() {
    if (!geo || !wallImg.naturalWidth) return;
    const dpr = devicePixelRatio, key = `${geo.mw}x${geo.mh}@${dpr}`;
    if (key === bakedFor) return;
    bakedFor = key;
    const W = Math.round(geo.mw * dpr), H = Math.round(geo.mh * dpr);
    wall.width = W; wall.height = H;
    wall.style.width = `${geo.mw}px`; wall.style.height = `${geo.mh}px`;
    const s = Math.max(W / wallImg.naturalWidth, H / wallImg.naturalHeight);
    const iw = wallImg.naturalWidth * s, ih = wallImg.naturalHeight * s, pad = 10 * dpr; // pad: kein dunkler Blur-Rand
    const ctx = wall.getContext('2d');
    // leicht abgedunkelt wie Mica: ruhig, aber ohne graue Tönungsschicht
    ctx.filter = `blur(${4 * dpr}px) saturate(1.05) brightness(.72)`;
    ctx.drawImage(wallImg, (W - iw) / 2 - pad, (H - ih) / 2 - pad, iw + 2 * pad, ih + 2 * pad);
    wall.classList.add('ready');
    scheduleInk();
  }
  function placeWall() {
    if (geo) wall.style.transform = `translate3d(${geo.mx - geo.x}px, ${geo.my - geo.y}px, 0)`;
  }
  window.setGeometry = (g) => {
    geo = g;
    document.body.classList.toggle('seamless', !g.floating);
    document.documentElement.style.setProperty('--radius', g.floating ? '8px' : '0px');
    bakeWall();
    placeWall();
    scheduleInk();
  };

  // ---------- Schriftfarbe je nach Hintergrund ----------
  // Glass zeichnet das Wallpaper selbst hinter das Glas – also lässt sich messen, wie hell es unter jeder
  // Glasfläche ist. Wäre dunkle Schrift dort besser lesbar als helle, bekommt die Fläche .ink-dark.
  const INK = ['#toolbar', '#address', '#suggest', '#favs', '#private-note'];
  const probe = document.createElement('canvas');
  probe.width = 24; probe.height = 8;
  const probeCtx = probe.getContext('2d', { willReadFrequently: true });
  const linear = (v) => (v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  // Mittlere relative Leuchtdichte hinter dem Element – so, wie das Glas sie zeigt (abgedunkelt, leicht aufgehellt)
  function backdropLuminance(el) {
    const r = el.getBoundingClientRect(), c = wall.getBoundingClientRect();
    if (!r.width || !r.height || !c.width || !wall.classList.contains('ready')) return null;
    const k = wall.width / c.width;
    probeCtx.clearRect(0, 0, probe.width, probe.height);
    probeCtx.drawImage(wall, (r.left - c.left) * k, (r.top - c.top) * k, r.width * k, r.height * k, 0, 0, probe.width, probe.height);
    const d = probeCtx.getImageData(0, 0, probe.width, probe.height).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) {
      const [R, G, B] = [d[i], d[i + 1], d[i + 2]].map((v) => linear((v * .82 * .92 + 255 * .08) / 255));
      sum += .2126 * R + .7152 * G + .0722 * B;
    }
    return sum / (d.length / 4);
  }
  // Ab etwa 0,2 ist dunkle Schrift kontrastreicher als weiße; Umschaltpunkte auseinander, damit nichts flackert
  function updateInk() {
    for (const sel of INK) {
      const el = document.querySelector(sel);
      if (!el || !el.offsetWidth) continue;
      const lum = backdropLuminance(el);
      if (lum == null) continue;
      const dark = el.classList.contains('ink-dark') ? lum > .17 : lum > .22;
      el.classList.toggle('ink-dark', dark);
      // das Adressfeld steckt in der Leiste: eigene Wahl auch dann, wenn die Leiste anders entschieden hat
      if (sel === '#address') el.classList.toggle('ink-light', !dark);
    }
  }
  let inkFrame = 0;
  function scheduleInk() {
    if (!inkFrame) inkFrame = requestAnimationFrame(() => { inkFrame = 0; updateInk(); });
  }
  addEventListener('resize', scheduleInk);

  // ---------- Tabs ----------
  function makeTab(tab) {
    const el = document.createElement('div');
    el.className = 'tab';
    el.innerHTML = `<button class="close" title="Tab schließen (Strg+W)">${svg('close')}</button>
                    <span class="tab-label"><span class="fav"></span><span class="title"></span></span>`;
    el.dataset.id = tab.id;
    draggable(el, () => tab.id, () => send('activate', { id: tab.id }));
    el.addEventListener('auxclick', (e) => { if (e.button === 1) send('close_tab', { id: tab.id }); });
    el.querySelector('.close').addEventListener('click', () => send('close_tab', { id: tab.id }));
    return el;
  }

  // Kurzer Klick (erst beim Loslassen) ruft `click` auf, Ziehen legt den Tab neben einen anderen oder löst ihn.
  // `idOf` liefert den gezogenen Tab – oder null, wenn gerade nicht gezogen werden darf.
  function draggable(el, idOf, click) {
    el.addEventListener('pointerdown', (e) => {
      const id = idOf();
      if (e.button !== 0 || e.target.closest('.close') || id == null) return;
      // Partner für das Ablegen auf der Webseite: bei geteiltem Tab die andere Hälfte (→ Seiten tauschen),
      // sonst die gerade sichtbare Seite.
      const split = activeSplit();
      const partner = split && (split.left === id ? split.right : split.right === id ? split.left : null);
      tabDrag = { id, el, x0: e.clientX, y0: e.clientY, moved: false, base: partner ?? state.active, drop: null };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      const d = tabDrag;
      if (!d || d.el !== el) return;
      const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      if (!d.moved && Math.hypot(dx, dy) < 6) return;
      d.moved = true;
      el.classList.add('dragging');
      document.body.classList.add('tab-dragging');
      el.style.transform = `translate(${dx}px, ${dy}px) scale(1.04)`;
      updateDrop(d, e);
    });
    el.addEventListener('pointerup', () => {
      const d = tabDrag;
      if (!d || d.el !== el) return;
      endTabDrag();
      if (!d.moved) click();
      else if (d.drop?.type === 'tab') send('split', { id: d.id, target: d.drop.id, value: d.drop.side });
      else if (d.drop?.type === 'page') send('split', { id: d.id, target: d.base, value: d.drop.side });
      else if (d.drop?.type === 'bar') {
        // Aus der Kombination gelöst: Der gezogene Tab kehrt an seinen Platz in der Leiste zurück,
        // der andere steht (bzw. bleibt) im Adressfeld
        const index = state.tabs.findIndex((t) => t.id === d.id);
        send('move_tab', { id: d.id, index });
        send('activate', { id: d.base });
      }
    });
    el.addEventListener('pointercancel', endTabDrag);
  }

  // ---------- Tab ziehen → geteilte Ansicht ----------
  let tabDrag = null;
  const SPLIT_GAP = 4; // = SPLIT_GAP in main.rs
  const hasPage = (id) => !!state.tabs.find((t) => t.id === id)?.page;

  function updateDrop(d, e) {
    const under = document.elementsFromPoint(e.clientX, e.clientY).find((n) => !d.el.contains(n));
    // Das eingefahrene Adressfeld steht für den aktiven Tab – auch darauf lässt sich ein Tab ablegen
    const tabEl = under?.closest?.('.tab, body:not(.start) #address:not(.editing)');
    const targetId = !tabEl ? null : tabEl === address ? state.active : Number(tabEl.dataset.id);
    const split = activeSplit();
    let drop = null;
    if (tabEl && targetId !== d.id && hasPage(targetId) && hasPage(d.id)) {
      // Auf einem Tab: die Hälfte unter dem Zeiger bestimmt, auf welche Seite der gezogene Tab kommt.
      // Ausnahme: auf den eigenen Partner gezogen wird immer getauscht – egal, welche Hälfte man trifft.
      const r = tabEl.getBoundingClientRect();
      const partnered = split && [split.left, split.right].includes(d.id) && [split.left, split.right].includes(targetId);
      const side = partnered ? (split.left === d.id ? 'right' : 'left') : e.clientX < r.left + r.width / 2 ? 'left' : 'right';
      drop = { type: 'tab', id: targetId, side };
    } else if (!tabEl && e.clientY < state.chromeHeight && under?.closest?.('#toolbar') && !under.closest('.center')
               && (state.split?.left === d.id || state.split?.right === d.id)) {
      // Irgendwo in die Leiste außerhalb des Adressfelds (meist: zurück in die Mitte): geteilten Tab wieder lösen
      drop = { type: 'bar' };
    } else if (!tabEl && e.clientY > state.chromeHeight && d.base !== d.id && hasPage(d.base) && hasPage(d.id)) {
      // Über der Webseite: linke oder rechte Hälfte, je nach Mauszeiger
      const panes = state.panes, first = panes[0], last = panes[panes.length - 1];
      const x = first.x, w = last.x + last.w - first.x, half = (w - SPLIT_GAP) / 2;
      const side = e.clientX < x + w / 2 ? 'left' : 'right';
      drop = { type: 'page', side, rect: { x: side === 'left' ? x : x + w - half, y: first.y, w: half, h: first.h } };
    }
    const key = drop ? `${drop.type}:${drop.id ?? ''}:${drop.side ?? ''}` : '';
    if (key === (d.dropKey || '')) return;
    d.dropKey = key;
    d.drop = drop;
    [...tabEls.values(), address].forEach((t) => {
      const hit = drop?.type === 'tab' && t === tabEl;
      t.classList.toggle('drop-left', hit && drop.side === 'left');
      t.classList.toggle('drop-right', hit && drop.side === 'right');
    });
    document.body.classList.toggle('drop-unsplit', drop?.type === 'bar');
    showDropzone(drop?.rect);
  }

  // Die Ablagezone liegt über der Webseite → wie bei den Vorschlägen aus deren Region aussparen
  function showDropzone(rect) {
    const zone = $('dropzone');
    zone.classList.toggle('show', !!rect);
    if (rect) Object.assign(zone.style, { left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.w}px`, height: `${rect.h}px` });
    send('overlay', { rect: rect ? { ...rect, r: 8 } : null });
  }

  function endTabDrag() {
    const d = tabDrag;
    tabDrag = null;
    if (!d) return;
    d.el.classList.remove('dragging');
    d.el.style.transform = '';
    document.body.classList.remove('tab-dragging');
    [...tabEls.values(), address].forEach((t) => t.classList.remove('drop-left', 'drop-right'));
    document.body.classList.remove('drop-unsplit');
    if (d.dropKey?.startsWith('page')) showDropzone(null);
  }

  function updateFavicon(el, tab) {
    const fav = el.querySelector('.fav');
    const icon = tab.favicon?.startsWith('data:image/png;base64,') ? tab.favicon : '';
    const key = tab.loading ? 'loading' : tab.private ? 'private' : icon;
    if (fav.dataset.key === key) return;
    fav.dataset.key = key;
    if (tab.loading) { fav.innerHTML = '<div class="spinner"></div>'; return; }
    // Privat: kein Favicon laden – die Oberfläche läuft im normalen Profil und würde den Besuch dort im Cache hinterlassen
    if (tab.private) { fav.innerHTML = svg('private'); return; }
    fav.innerHTML = svg('globe');
    if (icon) {
      const img = new Image();
      img.onload = () => { if (fav.dataset.key === key) fav.replaceChildren(img); };
      img.src = icon;
    }
  }

  // Tabs gleiten an ihren neuen Platz, wenn der aktive Tab die Leiste verlässt oder zurückkehrt (FLIP)
  const TAB_FLIP = { duration: 450, easing: 'cubic-bezier(.3, 1.2, .45, 1)' };
  function renderTabs() {
    const box = $('tabs');
    const before = new Map();
    for (const [id, el] of tabEls) if (el.offsetWidth && el !== tabDrag?.el) before.set(id, el.getBoundingClientRect().left);
    renderTabList(box);
    for (const [id, el] of tabEls) {
      const x = before.get(id);
      if (x == null || !el.offsetWidth) continue;
      el.getAnimations().forEach((a) => { if (a.id === 'flip') a.cancel(); }); // sonst misst die neue Lage die alte Bewegung mit
      const dx = x - el.getBoundingClientRect().left;
      if (Math.abs(dx) > .5) el.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { ...TAB_FLIP, id: 'flip' });
    }
  }
  function renderTabList(box) {
    const ids = new Set(state.tabs.map((t) => t.id));
    for (const [id, el] of tabEls) if (!ids.has(id)) { el.remove(); tabEls.delete(id); }
    // Geteilte Ansicht: Der aktive Tab steht im Adressfeld, sein Partner rechts in derselben Kapsel (kein Tab doppelt)
    const split = activeSplit(), inBar = !document.body.classList.contains('start');
    const docked = split && inBar ? (split.left === state.active ? split.right : split.left) : null;
    center.classList.toggle('docked', docked != null); // Adressfeld wird um den Partner breiter
    // Ist gerade ein anderer Tab aktiv, steht ein kombiniertes Paar trotzdem als Einheit in der Leiste:
    // beide nebeneinander (links, rechts wie auf der Seite) an der Stelle des vorderen
    const grouped = state.split && !split ? state.split : null;
    const byId = new Map(state.tabs.map((t) => [t.id, t]));
    const order = grouped
      ? state.tabs.flatMap((t) => (t.id === grouped.left || t.id === grouped.right)
        ? (state.tabs.find((u) => u.id === grouped.left || u.id === grouped.right) === t ? [byId.get(grouped.left), byId.get(grouped.right)].filter(Boolean) : [])
        : [t])
      : state.tabs;
    let prev = $('lens');
    order.forEach((tab) => {
      let el = tabEls.get(tab.id);
      if (!el) { el = makeTab(tab); tabEls.set(tab.id, el); }
      // Nur umhängen, wenn die Reihenfolge nicht stimmt: Neu eingefügte Elemente starten ihre
      // Einblend-Animation von vorn – sonst blinken beim Tabwechsel alle Namen. (Vor den Tabs steht die Linse.)
      if (tab.id === docked) {
        if (el.parentElement !== center) center.append(el);
      } else {
        if (prev.nextElementSibling !== el) prev.after(el);
        prev = el;
      }
      el.classList.toggle('docked', tab.id === docked);
      el.classList.toggle('active', tab.id === state.active);
      el.classList.toggle('in-slot', tab.id === state.active && inBar);
      el.classList.toggle('private', !!tab.private);
      el.classList.toggle('paired', !!split && [split.left, split.right].includes(tab.id));
      el.classList.toggle('pair-left', grouped?.left === tab.id);
      el.classList.toggle('pair-right', grouped?.right === tab.id);
      const title = tab.title || hostOf(tab.url) || 'Neuer Tab';
      const label = el.querySelector('.title');
      if (label.textContent !== title) { label.textContent = title; el.title = title; }
      updateFavicon(el, tab);
    });
    placeNewTab();
    requestAnimationFrame(placeLens);
    scheduleSides(); // mehr oder weniger Tabs → Adressfeld schmaler oder breiter
  }

  // Liste leer (der einzige Tab steht im Adressfeld): „+“ rückt direkt rechts neben das Feld,
  // statt allein in der Mitte zu stehen. Beim Umziehen gleitet es von der alten an die neue Stelle.
  function placeNewTab() {
    const btn = $('btn-new');
    // (auch bei einem einzigen kombinierten Paar: beide stehen dann im Feld)
    const solo = !document.body.classList.contains('start') && !$('tabs').querySelector('.tab:not(.in-slot)');
    const home = solo ? document.querySelector('.side.left') : $('tabbar');
    if (btn.parentElement === home) return;
    const from = btn.getBoundingClientRect();
    home.append(btn);
    balanceSides(); // Seitenbreiten sofort anpassen, damit das Ziel stimmt
    const to = btn.getBoundingClientRect();
    if (from.width && to.width) {
      btn.animate([{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px)` }, { transform: 'none' }], TAB_FLIP);
    }
  }

  function placeLens() {
    const lensEl = $('lens');
    for (const t of tabEls.values()) t.classList.toggle('compact', t.offsetWidth < 96);
    // Die Linse liegt auf den sichtbaren Tabs der aktuellen Ansicht: Ein einzelner aktiver Tab steht links im
    // Adressfeld (außer auf dem Startbildschirm) – dann gibt es keine; ein geteiltes Paar umfasst sie ganz.
    const split = activeSplit();
    const shown = (split ? [split.left, split.right] : [state.active])
      .map((id) => tabEls.get(id)).filter((t) => t?.offsetWidth && t.parentElement === $('tabs'))
      .sort((x, y) => x.offsetLeft - y.offsetLeft);
    lensEl.classList.toggle('off', !shown.length);
    if (!shown.length) { lastActive = null; lensEl.classList.add('instant'); return; }
    const [a, b] = [shown[0], shown[shown.length - 1]];
    const key = split ? `split:${split.left}:${split.right}` : state.active;
    if (lastActive !== null && lastActive !== key) {
      lensEl.classList.remove('squish'); void lensEl.offsetWidth; lensEl.classList.add('squish');
    }
    lensEl.style.transform = `translateX(${a.offsetLeft}px)`;
    lensEl.style.width = `${b.offsetLeft + b.offsetWidth - a.offsetLeft}px`;
    lastActive = key;
    requestAnimationFrame(() => lensEl.classList.remove('instant'));
  }
  // Die Tabs teilen sich die Zeile mit dem Adressfeld: ändert sich ihr Platz (Fenstergröße), Linse nachziehen
  let tabsFrame = 0;
  new ResizeObserver(() => {
    if (!tabsFrame) tabsFrame = requestAnimationFrame(() => { tabsFrame = 0; placeLens(); });
  }).observe($('tabs'));

  // ---------- Adressfeld (in der Leiste eingefahren: Lupe + Neu laden; beim Suchen fährt es aus) ----------
  const address = $('address'), input = $('addr-input');
  const editing = () => document.activeElement === input;

  // ---------- Suchanbieter (Rust kennt dieselben Kennungen: SEARCH_ENGINES in main.rs) ----------
  const favicon = (domain) => `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
  const ENGINES = [
    // `origin`: wohin die Suche führt (wie SEARCH_ENGINES in main.rs) – dorthin wärmt warmUp() die Verbindung vor
    { id: 'google', name: 'Google', origin: 'https://www.google.com', icon: favicon('google.com'), hint: 'Suchbegriff oder Websitename eingeben' },
    { id: 'chatgpt', name: 'ChatGPT', origin: 'https://chatgpt.com', icon: favicon('chatgpt.com'), hint: 'ChatGPT fragen oder Website eingeben' },
    { id: 'claude', name: 'Claude', origin: 'https://claude.ai', icon: favicon('claude.ai'), hint: 'Claude fragen oder Website eingeben' },
    // Gemini, Kimi und Z.ai nehmen keinen Prompt über die Adresse an – Glass tippt ihn dort ein (prompt.js)
    { id: 'gemini', name: 'Gemini', origin: 'https://gemini.google.com', icon: favicon('gemini.google.com'), hint: 'Gemini fragen oder Website eingeben' },
    { id: 'kimi', name: 'Kimi', origin: 'https://www.kimi.ai', icon: favicon('kimi.ai'), hint: 'Kimi fragen oder Website eingeben' },
    { id: 'zai', name: 'Z.ai', origin: 'https://chat.z.ai', icon: favicon('z.ai'), hint: 'Z.ai fragen oder Website eingeben' },
  ];
  // Jeder neue Tab beginnt mit Google (siehe window.render) – die Wahl wird deshalb nicht gespeichert
  let engine = ENGINES[0];
  const engineImg = (e) => { const img = new Image(); img.src = e.icon; img.alt = ''; return img; };
  const engineBtn = $('btn-engine');
  function renderEngine() {
    engineBtn.replaceChildren(engineImg(engine));
    engineBtn.title = `Suchen mit ${engine.name} – klicken zum Wechseln`;
  }
  function setEngine(e) {
    engine = e;
    renderEngine();
    renderAddress();
  }
  // Gewählt wird nur auf dem Startbildschirm; in der Leiste oben sucht immer Google
  const searchEngine = () => (document.body.classList.contains('start') ? engine : ENGINES[0]);

  function searchQuery(url) {
    const u = parse(url);
    return u && /(^|\.)google\.[a-z.]+$/.test(u.hostname) && u.pathname === '/search' ? u.searchParams.get('q') : null;
  }

  function renderAddress() {
    const tab = activeTab();
    const url = tab?.url || '';
    const query = searchQuery(url);
    const { hint } = searchEngine();
    const placeholder = tab?.private ? `Privat: ${hint}` : hint;
    input.placeholder = placeholder;
    address.title = editing() || document.body.classList.contains('start') ? '' : 'Suchen oder Adresse eingeben (Strg+L)';
    if (!editing()) input.value = query || url;
    renderSlot(tab);
    address.classList.toggle('loading', !!tab?.loading);
    const reload = $('btn-reload');
    reload.innerHTML = svg(tab?.loading ? 'stop' : 'reload');
    reload.title = tab?.loading ? 'Laden stoppen' : 'Neu laden (F5)';
    reload.style.visibility = tab?.page ? 'visible' : 'hidden';
    $('btn-back').disabled = !tab?.page;
    $('btn-fwd').disabled = !(tab?.page || tab?.home);
    renderStar();
    renderShield();
  }

  // ---------- Aktiver Tab im eingefahrenen Adressfeld ----------
  const slot = $('addr-tab');
  $('addr-close').innerHTML = svg('close');
  let slotTab = null;
  function renderSlot(tab) {
    const title = tab ? tab.title || hostOf(tab.url) || 'Neuer Tab' : '';
    const label = slot.querySelector('.title');
    if (label.textContent !== title) label.textContent = title;
    if (tab) updateFavicon(slot, tab);
    // Neuer Tab rückt von den Tabs herüber ins Feld
    if (tab?.id !== slotTab) {
      if (slotTab !== null) { slot.classList.remove('swap'); void slot.offsetWidth; slot.classList.add('swap'); }
      slotTab = tab?.id ?? null;
    }
  }
  slot.addEventListener('animationend', () => slot.classList.remove('swap'));
  // Herausziehen: auf einen Tab oder die Webseite = kombinieren, in die Leiste = aus der Kombination lösen
  draggable(slot, () => (editing() || document.body.classList.contains('start') ? null : state.active), () => window.focusAddress());
  $('addr-close').addEventListener('pointerdown', (e) => e.preventDefault()); // nicht ins Suchfeld wechseln
  $('addr-close').addEventListener('click', () => send('close_tab', { id: state.active }));
  // Mittlere Maustaste schließt den Tab, wie in der Tab-Leiste
  address.addEventListener('auxclick', (e) => {
    if (e.button === 1 && !editing() && !document.body.classList.contains('start')) send('close_tab', { id: state.active });
  });

  // ---------- Werbeblocker-Schild ----------
  const shield = $('btn-shield');
  function renderShield() {
    const tab = activeTab();
    shield.hidden = !(tab?.page && /^https?:/.test(tab.url));
    if (shield.hidden) return;
    const host = hostOf(tab.url);
    shield.classList.toggle('off', !tab.adblock);
    shield.innerHTML = svg(tab.adblock ? 'shield' : 'shieldOff') + (tab.adblock && tab.blocked ? `<span>${tab.blocked}</span>` : '');
    shield.title = tab.adblock
      ? `Werbeblocker: ${tab.blocked} ${tab.blocked === 1 ? 'Anfrage' : 'Anfragen'} blockiert – klicken, um ihn auf ${host} auszuschalten`
      : `Werbeblocker ist auf ${host} aus – klicken zum Einschalten`;
  }
  shield.addEventListener('click', () => send('adblock_toggle'));
  // Rust meldet jede Sperre einzeln; nur den Zähler auffrischen statt alles neu zu zeichnen
  window.setBlocked = (id, n) => {
    const tab = state.tabs.find((t) => t.id === id);
    if (!tab) return;
    tab.blocked = n;
    if (id === state.active) renderShield();
  };

  address.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('button') || editing()) return;
    e.preventDefault();
    // Der Tab im Feld lässt sich auch herausziehen – er öffnet die Suche erst beim Loslassen (draggable)
    if (!e.target.closest('#addr-tab')) window.focusAddress();
  });
  $('addr-search').addEventListener('pointerdown', (e) => e.preventDefault());
  $('addr-search').addEventListener('click', () => window.focusAddress());
  // Ein- und Ausfahren in der Leiste: Während sich die Breite ändert, läuft das Glas ohne Lichtbrechung
  // (die Karte passt nur zu einer festen Größe) und die Vorschläge warten, bis das Feld seine Endbreite hat.
  function slide(open) {
    const inBar = !document.body.classList.contains('start');
    document.body.classList.toggle('searching', open && inBar);
    address.classList.toggle('editing', open);
    if (!inBar) return;
    address.classList.add('resizing');
    address.style.backdropFilter = '';
    delete address.dataset.lensSize;
    address.dataset.lensToken = 'slide'; // noch ausstehende Linsen verwerfen
  }
  const slideDone = (e) => {
    if (e.target !== address || e.propertyName !== 'width') return;
    // Abgebrochen, weil gleich wieder in die andere Richtung gefahren wird? Dann auf deren Ende warten –
    // sonst würden Linse und Vorschläge mit der Zwischenbreite vermessen.
    if (address.getAnimations().some((a) => a.transitionProperty === 'width' && a.playState === 'running')) return;
    address.classList.remove('resizing');
    GlassLens.lens(address);
    placeSuggest();
    scheduleInk();
  };
  address.addEventListener('transitionend', slideDone);
  address.addEventListener('transitioncancel', slideDone);
  // Klick in eine Webseite: Die Oberfläche verliert den Fokus, das Feld bliebe aber ihr „zuletzt fokussiertes“
  // Element – beim nächsten Klick auf die Leiste gäbe Chromium ihm den Fokus zurück und es führe von selbst aus.
  // (Auf dem Startbildschirm ist genau das erwünscht: zurück im Fenster kann man gleich weitertippen.)
  window.addEventListener('blur', () => {
    if (editing() && !document.body.classList.contains('start')) input.blur();
  });
  input.addEventListener('focus', () => {
    const url = activeTab()?.url || '';
    const query = searchQuery(url);
    input.value = query || url;
    slide(true);
    requestAnimationFrame(() => input.select());
    // Leeres Feld → letzte Suchen; auf einer Google-Ergebnisseite → ähnliche Suchen
    if (query) refreshSuggest(query, true);
    else if (!url) refreshSuggest('');
    warmUp('');
  });
  input.addEventListener('blur', () => {
    closeWheel();
    closeSuggest();
    slide(false);
    renderAddress();
  });
  input.addEventListener('keydown', (e) => {
    if (e.isComposing || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.key === 'Escape' && wheel.classList.contains('open')) closeWheel();
    else if (e.key === 'Escape') {
      if (suggestBox.classList.contains('open')) { closeSuggest(); input.value = typed; } else input.blur();
    } else if (['ArrowDown', 'ArrowUp', 'Tab'].includes(e.key) && suggestions.length && suggestBox.classList.contains('open')) {
      e.preventDefault();
      moveSuggestion(e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey) ? -1 : 1);
    }
  });
  address.addEventListener('submit', (e) => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value) return;
    // Prompts an KI-Chats merken (Google-Suchen erkennt recordSearches an der Ergebnis-URL)
    const choice = searchEngine();
    if (choice.id !== 'google' && !activeTab()?.private && !looksLikeUrl(value)) remember(choice.id, value);
    send('navigate', { value, engine: choice.id });
    input.blur();
  });

  // ---------- Suchvorschläge (von Google, abgerufen über Rust: /suggest) ----------
  const suggestBox = $('suggest');
  let suggestions = [], selected = -1, typed = '', suggestSeq = 0, suggestTimer = 0;
  function moveSuggestion(step) {
    // -1 ist der eigene Text; beide Richtungen laufen durch denselben Auswahlzyklus.
    const count = suggestions.length + 1;
    selected = (selected + 1 + step + count) % count - 1;
    input.value = selected < 0 ? typed : suggestions[selected];
    markSelected();
  }

  // ---------- Suchverlauf (nur lokal, im Speicher der Oberfläche) ----------
  // Je Anbieter ein eigener Verlauf: Google-Suchen wie bisher, dazu die Prompts an ChatGPT, Claude & Co.
  const HISTORY_MAX = 50;
  const historyKey = (id) => (id === 'google' ? 'glass.searchHistory' : `glass.promptHistory.${id}`);
  const histories = {};
  function historyOf(id) {
    if (!histories[id]) {
      try { histories[id] = JSON.parse(localStorage.getItem(historyKey(id))) || []; } catch { histories[id] = []; }
    }
    return histories[id];
  }
  const saveHistory = (id) => { try { localStorage.setItem(historyKey(id), JSON.stringify(histories[id])); } catch { /* egal */ } };
  function remember(id, q) {
    q = q.trim();
    const list = historyOf(id);
    if (!q || list[0] === q) return;
    histories[id] = [q, ...list.filter((h) => h.toLowerCase() !== q.toLowerCase())].slice(0, HISTORY_MAX);
    saveHistory(id);

  }
  const rememberSearch = (q) => remember('google', q);
  // Webadresse statt Suchbegriff? (wie resolve_input in main.rs – Adressen gehören in keinen Verlauf)
  function looksLikeUrl(v) {
    v = v.trim();
    if (/^[a-z][\w+.-]*:\/\//i.test(v) || /^(about|data):/i.test(v)) return true;
    if (/\s/.test(v)) return false;
    const host = v.split(/[/?#]/)[0];
    return /^(localhost|127\.0\.0\.1)/.test(host) || (host.includes('.') && !host.startsWith('.') && !host.endsWith('.'));
  }
  // Jede Google-Suche landet im Verlauf – auch die direkt auf google.com, erkennbar an der Ergebnis-URL
  const seenQueries = new Map();
  function recordSearches() {
    for (const tab of state.tabs) {
      if (tab.private) continue; // private Suchen landen nicht im Verlauf
      const q = searchQuery(tab.url);
      if (q && seenQueries.get(tab.id) !== q) { seenQueries.set(tab.id, q); rememberSearch(q); }
    }
  }

  // Liste neu aufbauen: passende frühere Suchen sofort, Google-Vorschläge kurz danach.
  // `related`: das Feld enthält die aktuelle Suche → „Ähnliche Suchen“ statt Ergänzungen.
  let related = false;
  function refreshSuggest(text, isRelated = false) {
    typed = text;
    related = isRelated;
    selected = -1;
    clearTimeout(suggestTimer);
    const q = text.trim(), lower = q.toLowerCase();
    // Privat: frühere Suchen nicht anzeigen – der private Tab soll wie ein unbeschriebenes Blatt wirken
    const past = (activeTab()?.private ? [] : q
      ? historyOf(searchEngine().id).filter((h) => h.toLowerCase().includes(lower) && h.toLowerCase() !== lower).slice(0, 3)
      : historyOf(searchEngine().id).slice(0, 6)
    ).map((text) => ({ text, kind: 'history' }));
    const seq = ++suggestSeq;
    // Ohne passende frühere Suchen nur ausblenden – closeSuggest() würde die folgende Google-Anfrage verwerfen
    if (past.length) showSuggest(past); else hideSuggest();
    if (!q) return;
    suggestTimer = setTimeout(async () => {
      try {
        const res = await fetch(`/suggest?q=${encodeURIComponent(q)}`);
        const list = res.ok ? await res.json() : [];
        if (seq !== suggestSeq || !editing()) return;
        const seen = new Set([...past.map((p) => p.text.toLowerCase()), ...(isRelated ? [lower] : [])]);
        const more = list.filter((s) => !seen.has(s.toLowerCase())).slice(0, 7 - past.length)
          .map((text) => ({ text, kind: isRelated ? 'related' : 'suggest' }));
        showSuggest([...past, ...more]);
      } catch { /* offline: einfach keine Vorschläge */ }
    }, isRelated ? 0 : 50);
  }
  input.addEventListener('input', () => { closeWheel(); refreshSuggest(input.value); warmUp(input.value); });

  // ---------- Verbindung vorwärmen ----------
  // Wie die Adressleiste von Chrome: schon beim Tippen DNS, TCP und TLS zum Ziel aufbauen, damit der Seitenaufruf
  // nach Enter nicht erst darauf wartet. Die Tabs teilen sich Profil und Verbindungen mit der Oberfläche.
  // Chromium schließt ungenutzte Verbindungen nach etwa 10 s – danach darf dasselbe Ziel erneut vorgewärmt werden.
  const warmed = new Map();
  let warmTimer = 0;
  function warmUp(text) {
    clearTimeout(warmTimer);
    if (activeTab()?.private) return; // private Eingaben sollen nicht über das normale Profil ins Netz
    const v = text.trim(), search = searchEngine().origin;
    let origin = search;
    if (looksLikeUrl(v)) {
      try {
        const url = new URL(/^[a-z][\w+.-]*:\/\//i.test(v) ? v : `https://${v}`);
        origin = /^https?:$/.test(url.protocol) ? url.origin : '';
      } catch { origin = ''; }
    }
    if (!origin) return;
    // Adressen erst, wenn das Tippen kurz ruht – sonst gingen DNS-Anfragen an „githu.co“ & Co.
    warmTimer = setTimeout(() => {
      const now = Date.now();
      if (now - (warmed.get(origin) || 0) < 10000) return;
      warmed.set(origin, now);
      document.querySelector(`link[rel=preconnect][href="${origin}"]`)?.remove();
      const link = document.createElement('link');
      link.rel = 'preconnect';
      link.href = origin;
      document.head.append(link);
    }, origin === search ? 0 : 250);
  }

  // Den Anbieter wählt man nur auf dem Startbildschirm; in der Leiste gibt es den Knopf nicht (dort sucht immer Google)
  engineBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation(); // Feld bleibt fokussiert
    if (!editing()) window.focusAddress();
    if (wheel.classList.contains('open')) closeWheel(); else openWheel();
  });

  // Startbildschirm: Anbieter-Rad. Es klappt nach rechts auf, der gewählte Anbieter sitzt links am Knopf.
  const wheel = $('wheel'), wheelSpin = wheel.querySelector('.spin');
  const WHEEL_ORBIT = 78, STEP = 360 / ENGINES.length;
  let wheelRot = 0, wheelTimer = 0;
  const slots = ENGINES.map((e, i) => {
    const slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'glass slot';
    slot.title = e.name;
    slot.style.setProperty('--a', `${i * STEP}deg`);
    slot.append(engineImg(e));
    slot.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); ev.stopPropagation(); // Fokus bleibt im Feld
      closeWheel(e === engine ? undefined : e); // der neue dreht sich beim Eindrehen über den bisherigen
    });
    wheelSpin.append(slot);
    return slot;
  });
  // Auf den gewählten Anbieter drehen – immer im Uhrzeigersinn
  function turnWheel() {
    const n = ENGINES.length, sel = ENGINES.indexOf(engine), target = -sel * STEP;
    wheelRot += (((target - wheelRot) % 360) + 360) % 360;
    wheel.style.setProperty('--rot', `${wheelRot}deg`);
    slots.forEach((s, i) => {
      s.classList.toggle('on', i === sel);
      s.style.zIndex = n - ((i - sel + n) % n);
    });
  }
  function openWheel() {
    closeSuggest();
    clearTimeout(wheelTimer);
    slots.forEach((s) => s.getAnimations({ subtree: true }).forEach((a) => a.cancel()));
    delete wheel.dataset.closing;
    wheel.classList.add('open', 'instant');
    // Mittelpunkt des Rads eine Umlaufbahn rechts vom Knopf: so liegt der linke Platz genau auf ihm
    const r = layoutRect(engineBtn);
    const cx = r.left + engineBtn.offsetWidth / 2 + WHEEL_ORBIT, cy = r.top + engineBtn.offsetHeight / 2;
    Object.assign(wheel.style, { left: `${cx - wheel.offsetWidth / 2}px`, top: `${cy - wheel.offsetHeight / 2}px` });
    turnWheel();
    requestAnimationFrame(() => requestAnimationFrame(() => wheel.classList.remove('instant')));
    document.body.classList.add('wheel-open');
    slots[ENGINES.indexOf(engine)].animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180 });
    moveSlots(true);
    if (!maskFrame) maskFrame = requestAnimationFrame(maskSlots);
  }
  // Die Kreise sind aus Glas, also durchscheinend: Wo einer über einem anderen liegt, wäre die Fläche doppelt so
  // dicht. Darum spart jeder Kreis genau den Teil aus, den ein höher liegender verdeckt – ein Stapel wirkt dann
  // wie ein einzelner Kreis, auch während die anderen darunter hervor- oder hineindrehen.
  let maskFrame = 0;
  function maskSlots() {
    maskFrame = 0;
    if (!wheel.classList.contains('open')) { slots.forEach((s) => { s.style.mask = ''; }); return; }
    const rects = slots.map((s) => s.getBoundingClientRect());
    slots.forEach((s, i) => {
      const r = rects[i], half = r.width / 2, scale = r.width / s.offsetWidth, z = +s.style.zIndex;
      const holes = [];
      rects.forEach((q, k) => {
        const radius = q.width / 2, dx = q.left + radius - r.left - half, dy = q.top + radius - r.top - half;
        if (+slots[k].style.zIndex <= z || Math.hypot(dx, dy) >= half + radius) return;
        holes.push(`radial-gradient(circle at ${(half + dx) / scale}px ${(half + dy) / scale}px, transparent ${(radius - .25) / scale}px, #000 ${(radius + .5) / scale}px)`);
      });
      s.style.mask = holes.join(', ');
      s.style.maskComposite = 'intersect';
    });
    maskFrame = requestAnimationFrame(maskSlots);
  }
  // Aus- und Eindrehen in einem Schwung, beides im Uhrzeigersinn: Das Rad dreht sich als Ganzes.
  // Öffnen: die Kreise lösen sich nacheinander vom Stapel unter dem gewählten, der am weitesten reist zuerst.
  // Schließen: jeder Kreis, der links am Knopf ankommt, bleibt dort liegen – unter dem bisherigen Anbieter,
  // nur ein neu gewählter (`pick`) legt sich obendrauf.
  function moveSlots(out, pick = -1) {
    const n = ENGINES.length, from = ENGINES.indexOf(engine), last = n - 1; // `from` liegt gerade links am Knopf
    const tuckedScale = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : .82;
    return Promise.all(slots.map((s, i) => {
      const j = (i - from + n) % n; // Plätze im Uhrzeigersinn hinter dem Knopf
      s.style.zIndex = i === pick ? n + 1 : n - j;
      if (pick >= 0) s.classList.toggle('on', i === pick);
      if (!j) return null;
      const deg = (k) => ({ '--off': `${k * STEP}deg` });

        return s.animate([{ ...deg(-j), '--travel-scale': tuckedScale, offset: 0 }, { ...deg(-j), '--travel-scale': tuckedScale, offset: (last - j) / last }, { ...deg(0), '--travel-scale': 1, offset: 1 }],
          { duration: 750, easing: 'cubic-bezier(.3, 1.1, .45, 1)', fill: 'backwards' }).finished;
      }
      const d = n - j; // so viele Plätze bis zum Knopf
      // Nicht gewählte Kugeln samt Logo vor dem Eintauchen verkleinern.
      // Der gewählte Anbieter behält seinen separaten Ankunfts-Pop.
      const endScale = i === pick ? 1 : tuckedScale;
      return s.animate([
        { ...deg(0), '--travel-scale': 1, offset: 0 },
        { ...deg(d - .8), '--travel-scale': 1, offset: (d - .8) / last },
        { ...deg(d), '--travel-scale': endScale, offset: d / last },
        { ...deg(d), '--travel-scale': endScale, offset: 1 },

        { duration: 650, easing: 'cubic-bezier(.45, 0, .4, 1)', fill: 'forwards' }).finished;

  // Logo-Wechsel auf die Ankunft des neuen Kreises abstimmen, auch bei kurzen Wegen.
  function swapWheelIcon(from, to) {
    const n = slots.length, j = (to - from + n) % n;
    if (!j || matchMedia('(prefers-reduced-motion: reduce)').matches) return Promise.resolve();
    const progress = (n - j) / (n - 1);
    // moveSlots nutzt cubic-bezier(.45, 0, .4, 1): Wegfortschritt in Zeit zurückrechnen.
    let lo = 0, hi = 1;
    for (let i = 0; i < 16; i++) {
      const t = (lo + hi) / 2;
      if (t * t * (3 - 2 * t) < progress) lo = t; else hi = t;
    }
    const t = (lo + hi) / 2;
    const arrival = 650 * (3 * (1 - t) ** 2 * t * .45 + 3 * (1 - t) * t * t * .4 + t ** 3);
    const oldIcon = slots[from].querySelector('img'), newIcon = slots[to].querySelector('img');
    const shrink = oldIcon.animate([
      { transform: 'scale(1)', opacity: 1 },
      { transform: 'scale(.15)', opacity: 0 },
    ], { delay: Math.max(0, arrival - 105), duration: 95, easing: 'ease-in', fill: 'forwards' });
    const pop = newIcon.animate([
      { transform: 'scale(1)', offset: 0 },
      { transform: 'scale(1.18)', offset: .38 },
      { transform: 'scale(1)', offset: 1 },
    ], { delay: Math.max(0, arrival - 45), duration: 230, easing: 'ease-out', fill: 'both' });
    // Nur die Glaskugel vergrößern: der Mittelpunkt bleibt auf der Umlaufbahn,
    // und der separate Logo-Pop wird nicht zusätzlich mitskaliert.
    const glassPop = slots[to].animate([
      { '--arrival-scale': 1, offset: 0 },
      { '--arrival-scale': 1.08, offset: .38 },
      { '--arrival-scale': 1, offset: 1 },
    ], { delay: Math.max(0, arrival - 45), duration: 230, easing: 'ease-out', fill: 'both' });
    return Promise.all([shrink.finished, pop.finished, glassPop.finished]);
  }
  function closeWheel(pick) {
    clearTimeout(wheelTimer);
    if (!wheel.classList.contains('open') || wheel.dataset.closing) return;
    wheel.dataset.closing = '1';
    const from = ENGINES.indexOf(engine), to = pick ? ENGINES.indexOf(pick) : -1;
    const moving = Promise.all([moveSlots(false, to), to >= 0 ? swapWheelIcon(from, to) : Promise.resolve()]);
    if (pick) setEngine(pick);
    // Knopf erst zeigen, wenn alles eingedreht ist – sonst läge er schon mit dem neuen Logo unter dem Stapel
    moving.then(() => {

      delete wheel.dataset.closing;
      wheel.classList.remove('open');

  }
  // Mausrad über dem Rad: einen Platz im Uhrzeigersinn weiterdrehen (von unten rückt der nächste nach)
  wheel.addEventListener('wheel', (e) => {
    e.preventDefault();
    clearTimeout(wheelTimer);
    const n = ENGINES.length, i = ENGINES.indexOf(engine);
    if (!e.deltaY || wheel.dataset.closing) return;
    setEngine(ENGINES[(i - 1 + n) % n]);
    turnWheel();
  }, { passive: false });
  wheel.addEventListener('pointerdown', (e) => e.preventDefault()); // Klick auf das Rad: Fokus bleibt im Feld
  // Klick daneben schließt das Rad
  document.addEventListener('pointerdown', (e) => {
    if (wheel.classList.contains('open') && !wheel.contains(e.target) && !engineBtn.contains(e.target)) closeWheel();
  }, true);
  renderEngine();

  function showSuggest(items) {
    suggestions = items.map((i) => i.text);
    if (!items.length) { closeSuggest(); return; }
    const lower = typed.trim().toLowerCase();
    const nodes = [];
    items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'sg';
      row.innerHTML = svg(item.kind === 'history' ? 'clock' : 'search');
      const label = document.createElement('span');
      label.className = 'sg-text';
      // Wie bei Google: getippter Teil normal, die Ergänzung fett
      if (lower && item.text.toLowerCase().startsWith(lower)) {
        const rest = document.createElement('b');
        rest.textContent = item.text.slice(lower.length);
        label.append(item.text.slice(0, lower.length), rest);
      } else label.textContent = item.text;
      row.append(label);
      if (item.kind === 'history') {
