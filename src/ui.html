  function scheduleInk() {
    if (!inkFrame) inkFrame = requestAnimationFrame(() => { inkFrame = 0; updateInk(); });
  }
  addEventListener('resize', scheduleInk);

  // ---------- Tabs ----------
  function makeTab(tab) {
    const el = document.createElement('div');
    el.className = 'tab';
    el.innerHTML = `<button class="close" title="Tab schließen (Strg+W)">${svg('close')}</button>
                    <span class="tab-label"><span class="fav"></span><span class="title"></span></span>`;
    el.dataset.id = tab.id;
    draggable(el, () => tab.id, () => send('activate', { id: tab.id }));
    el.addEventListener('auxclick', (e) => { if (e.button === 1) send('close_tab', { id: tab.id }); });
    el.querySelector('.close').addEventListener('click', () => send('close_tab', { id: tab.id }));
    return el;
  }

  // Kurzer Klick (erst beim Loslassen) ruft `click` auf, Ziehen legt den Tab neben einen anderen oder löst ihn.
  // `idOf` liefert den gezogenen Tab – oder null, wenn gerade nicht gezogen werden darf.
  function draggable(el, idOf, click) {
    el.addEventListener('pointerdown', (e) => {
      const id = idOf();
      if (e.button !== 0 || e.target.closest('.close') || id == null) return;
      // Partner für das Ablegen auf der Webseite: bei geteiltem Tab die andere Hälfte (→ Seiten tauschen),
      // sonst die gerade sichtbare Seite.
      const split = activeSplit();
      const partner = split && (split.left === id ? split.right : split.right === id ? split.left : null);
      tabDrag = { id, el, x0: e.clientX, y0: e.clientY, moved: false, base: partner ?? state.active, drop: null };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      const d = tabDrag;
      if (!d || d.el !== el) return;
      const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      if (!d.moved && Math.hypot(dx, dy) < 6) return;
      d.moved = true;
      el.classList.add('dragging');
      document.body.classList.add('tab-dragging');
      el.style.transform = `translate(${dx}px, ${dy}px) scale(1.04)`;
      updateDrop(d, e);
    });
    el.addEventListener('pointerup', () => {
      const d = tabDrag;
      if (!d || d.el !== el) return;
      endTabDrag();

      else if (d.drop?.type === 'tab') send('split', { id: d.id, target: d.drop.id, value: d.drop.side });
      else if (d.drop?.type === 'page') send('split', { id: d.id, target: d.base, value: d.drop.side });
      else if (d.drop?.type === 'bar') {

        // der andere steht (bzw. bleibt) im Adressfeld

  // ---------- Tab ziehen → geteilte Ansicht ----------
  let tabDrag = null;
  const SPLIT_GAP = 4; // = SPLIT_GAP in main.rs
  const hasPage = (id) => !!state.tabs.find((t) => t.id === id)?.page;
  // Leiste links statt oben (Einstellung im Kontextmenü der Leiste)
  const sideLeft = () => document.body.classList.contains('side-left');
  // Liegt der Punkt auf der Leiste (oben bzw. links) statt über der Webseite?
  const SIDE_TOP = 28; // = --side-top
  const overChrome = (x, y) => (sideLeft() ? x < state.chromeWidth || y < SIDE_TOP : y < state.chromeHeight);

  function updateDrop(d, e) {
    const under = document.elementsFromPoint(e.clientX, e.clientY).find((n) => !d.el.contains(n));
    // Das eingefahrene Adressfeld steht für den aktiven Tab – auch darauf lässt sich ein Tab ablegen

    const targetId = !tabEl ? null : tabEl === address ? state.active : Number(tabEl.dataset.id);
    const split = activeSplit();
    let drop = null;
    if (tabEl && targetId !== d.id && hasPage(targetId) && hasPage(d.id)) {
      // Auf einem Tab: die Hälfte unter dem Zeiger bestimmt, auf welche Seite der gezogene Tab kommt.
      // Ausnahme: auf den eigenen Partner gezogen wird immer getauscht – egal, welche Hälfte man trifft.
      const r = tabEl.getBoundingClientRect();

      const side = partnered ? (split.left === d.id ? 'right' : 'left') : e.clientX < r.left + r.width / 2 ? 'left' : 'right';
      drop = { type: 'tab', id: targetId, side };
    } else if (!tabEl && overChrome(e.clientX, e.clientY) && under?.closest?.('#toolbar') && !under.closest('.center')

    }
    const key = drop ? `${drop.type}:${drop.id ?? ''}:${drop.side ?? ''}` : '';
    if (key === (d.dropKey || '')) return;
    d.dropKey = key;
    d.drop = drop;

      const hit = drop?.type === 'tab' && t === tabEl;
      t.classList.toggle('drop-left', hit && drop.side === 'left');
      t.classList.toggle('drop-right', hit && drop.side === 'right');

  }

  // Die Ablagezone liegt über der Webseite → wie bei den Vorschlägen aus deren Region aussparen
  function showDropzone(rect) {

    if (rect) Object.assign(zone.style, { left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.w}px`, height: `${rect.h}px` });
    send('overlay', { rect: rect ? { ...rect, r: 8 } : null });
  }

  function endTabDrag() {
    const d = tabDrag;
    tabDrag = null;
    if (!d) return;
    d.el.classList.remove('dragging');
    d.el.style.transform = '';

    [...tabEls.values(), address].forEach((t) => t.classList.remove('drop-left', 'drop-right'));

  function updateFavicon(el, tab) {
    const fav = el.querySelector('.fav');
    const icon = tab.favicon?.startsWith('data:image/png;base64,') ? tab.favicon : '';
    const key = tab.mail ? 'mail' : tab.loading ? 'loading' : tab.private ? 'private' : icon;
    if (fav.dataset.key === key) return;
    fav.dataset.key = key;
    if (tab.mail) { fav.innerHTML = svg('mail'); return; } // Mail-Ansicht (mail.rs)
    if (tab.loading) { fav.innerHTML = '<div class="spinner"></div>'; return; }

  // Tabs gleiten an ihren neuen Platz, wenn der aktive Tab die Leiste verlässt oder zurückkehrt (FLIP)

  function renderTabs() {
    const box = $('tabs');

    // Geteilte Ansicht: Der aktive Tab steht im Adressfeld, sein Partner rechts in derselben Kapsel (kein Tab doppelt)

    center.classList.toggle('docked', docked != null); // Adressfeld wird um den Partner breiter

    // beide nebeneinander (links, rechts wie auf der Seite) an der Stelle des vorderen

    const byId = new Map(state.tabs.map((t) => [t.id, t]));
    const order = grouped
      ? state.tabs.flatMap((t) => (t.id === grouped.left || t.id === grouped.right)
        ? (state.tabs.find((u) => u.id === grouped.left || u.id === grouped.right) === t ? [byId.get(grouped.left), byId.get(grouped.right)].filter(Boolean) : [])
        : [t])

      el.classList.toggle('slotted', tab.id === slotted);
      el.classList.toggle('active', tab.id === state.active);
      el.classList.toggle('in-slot', tab.id === state.active && inBar);
      el.classList.toggle('private', !!tab.private);
      el.classList.toggle('paired', !!split && [split.left, split.right].includes(tab.id));
      el.classList.toggle('pair-left', grouped?.left === tab.id);
      el.classList.toggle('pair-right', grouped?.right === tab.id);
      const title = tab.title || hostOf(tab.url) || 'Neuer Tab';

  // Liste leer (der einzige Tab steht im Adressfeld): „+“ rückt direkt rechts neben das Feld,
  // statt allein in der Mitte zu stehen – in der Leiste links immer. Beim Umziehen gleitet es von der alten an die neue Stelle.
  function placeNewTab() {
    const btn = $('btn-new');
    // (auch bei einem einzigen kombinierten Paar: beide stehen dann im Feld)

    if (btn.parentElement === home) return;
    const from = btn.getBoundingClientRect();
    home.append(btn);
    balanceSides(); // Seitenbreiten sofort anpassen, damit das Ziel stimmt
    const to = btn.getBoundingClientRect();
    if (from.width && to.width) {
      btn.animate([{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px)` }, { transform: 'none' }], TAB_FLIP);
    }

  function placeLens() {

    const rows = [...bar.children].reduce((h, k) => h + k.offsetHeight, 0) + (parseFloat(getComputedStyle(bar).rowGap) || 0) * (bar.children.length - 1);

    const split = activeSplit();
    const shown = (split ? [split.left, split.right] : [state.active])
      .map((id) => tabEls.get(id)).filter((t) => t?.offsetWidth && t.parentElement === $('tabs'))
      .sort((x, y) => x.offsetLeft - y.offsetLeft || x.offsetTop - y.offsetTop);
    lensEl.classList.toggle('off', !shown.length);
    if (!shown.length) { lastActive = null; lensEl.classList.add('instant'); return; }
    const [a, b] = [shown[0], shown[shown.length - 1]];

    if (lastActive !== null && lastActive !== key) {

      lensEl.style.width = '';
      lensEl.style.height = `${b.offsetTop + b.offsetHeight - a.offsetTop}px`;
    } else {
      lensEl.style.transform = `translateX(${a.offsetLeft}px)`;
      lensEl.style.width = `${b.offsetLeft + b.offsetWidth - a.offsetLeft}px`;

  // Die Tabs teilen sich die Zeile mit dem Adressfeld: ändert sich ihr Platz (Fenstergröße), Linse nachziehen

  });
  tabsObserver.observe($('tabs'));
  tabsObserver.observe($('tabbar')); // Leiste links: Fensterhöhe ändert, ob die Liste scrollen muss

  // ---------- Adressfeld (in der Leiste eingefahren: Lupe + Neu laden; beim Suchen fährt es aus) ----------
  const address = $('address'), input = $('addr-input');
  const editing = () => document.activeElement === input;

  // ---------- Suchanbieter (Rust kennt dieselben Kennungen: SEARCH_ENGINES in main.rs) ----------
  const favicon = (domain) => `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
  const ENGINES = [
    // `origin`: wohin die Suche führt (wie SEARCH_ENGINES in main.rs) – dorthin wärmt warmUp() die Verbindung vor
    { id: 'google', name: 'Google', origin: 'https://www.google.com', icon: favicon('google.com'), hint: 'Suchbegriff oder Websitename eingeben' },
    { id: 'chatgpt', name: 'ChatGPT', origin: 'https://chatgpt.com', icon: favicon('chatgpt.com'), hint: 'ChatGPT fragen oder Website eingeben' },
    { id: 'claude', name: 'Claude', origin: 'https://claude.ai', icon: favicon('claude.ai'), hint: 'Claude fragen oder Website eingeben' },
    // Gemini, Kimi, Z.ai und Grok nehmen keinen Prompt über die Adresse an – Glass tippt ihn dort ein (prompt.js)
    { id: 'gemini', name: 'Gemini', origin: 'https://gemini.google.com', icon: favicon('gemini.google.com'), hint: 'Gemini fragen oder Website eingeben' },
    { id: 'kimi', name: 'Kimi', origin: 'https://www.kimi.ai', icon: favicon('kimi.ai'), hint: 'Kimi fragen oder Website eingeben' },
    { id: 'zai', name: 'Z.ai', origin: 'https://chat.z.ai', icon: favicon('z.ai'), hint: 'Z.ai fragen oder Website eingeben' },
    { id: 'grok', name: 'Grok', origin: 'https://grok.com', icon: favicon('grok.com'), hint: 'Grok fragen oder Website eingeben' },
    { id: 'youtube', name: 'YouTube', origin: 'https://www.youtube.com', icon: favicon('youtube.com'), hint: 'Auf YouTube suchen oder Website eingeben' },
    { id: 'amazon', name: 'Amazon', origin: 'https://www.amazon.de', icon: favicon('amazon.de'), hint: 'Auf Amazon suchen oder Website eingeben' },
  ];
  // Im Rad stehen Google und fünf weitere; welche, tauscht man per Rechtsklick auf einen Kreis (siehe setWheelEditing)

  function renderAddress() {

    const { hint } = searchEngine();

    renderShield();
  }

  // ---------- Aktiver Tab im eingefahrenen Adressfeld ----------
  const slot = $('addr-tab');
  $('addr-close').innerHTML = svg('close');
  let slotTab = null;
  function renderSlot(tab) {
    const title = tab ? tab.title || hostOf(tab.url) || 'Neuer Tab' : '';

  });

  // ---------- Werbeblocker-Schild ----------
  const shield = $('btn-shield');
  function renderShield() {
    const tab = activeTab();
    shield.hidden = !(tab?.page && /^https?:/.test(tab.url));
    if (shield.hidden) return;
    const host = hostOf(tab.url);
    shield.classList.toggle('off', !tab.adblock);

  // wie ein einzelner Kreis, auch während die anderen darunter hervor- oder hineindrehen.
  let maskFrame = 0;
  function maskSlots() {
    maskFrame = 0;
    if (!wheel.classList.contains('open')) { slots.forEach((s) => { s.style.mask = ''; }); return; }
    const rects = slots.map((s) => s.getBoundingClientRect());
    slots.forEach((s, i) => {
      const r = rects[i], half = r.width / 2, scale = r.width / s.offsetWidth, z = +s.style.zIndex;
      const holes = [];
      rects.forEach((q, k) => {
        const radius = q.width / 2, dx = q.left + radius - r.left - half, dy = q.top + radius - r.top - half;
        if (+slots[k].style.zIndex <= z || Math.hypot(dx, dy) >= half + radius) return;
        holes.push(`radial-gradient(circle at ${(half + dx) / scale}px ${(half + dy) / scale}px, transparent ${(radius - .25) / scale}px, #000 ${(radius + .5) / scale}px)`);
      });

  // Schließen: jeder Kreis, der links am Knopf ankommt, bleibt dort liegen – unter dem bisherigen Anbieter,
  // nur ein neu gewählter (`pick`) legt sich obendrauf.
  function moveSlots(out, pick = -1) {
    const n = slots.length, from = shown.indexOf(engine), last = n - 1; // `from` liegt gerade links am Knopf
    const tuckedScale = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : .82;
    return Promise.all(slots.map((s, i) => {

      const endScale = i === pick ? 1 : tuckedScale;

        { ...deg(0), '--travel-scale': 1, offset: 0 },
        { ...deg(d - .8), '--travel-scale': 1, offset: (d - .8) / last },
        { ...deg(d), '--travel-scale': endScale, offset: d / last },
        { ...deg(d), '--travel-scale': endScale, offset: 1 },

    let lo = 0, hi = 1;

      { transform: 'scale(1)', offset: 0 },
      { transform: 'scale(1.18)', offset: .38 },
      { transform: 'scale(1)', offset: 1 },
    ], { delay: Math.max(0, arrival - 45), duration: 230, easing: 'ease-out', fill: 'both' });

    // und der separate Logo-Pop wird nicht zusätzlich mitskaliert.
    const glassPop = slots[to].animate([
      { '--arrival-scale': 1, offset: 0 },
      { '--arrival-scale': 1.08, offset: .38 },

  function showSuggest(items) {
    suggestions = items.map((i) => i.text);

    items.forEach((item, i) => {
      const row = document.createElement('div');

      const label = document.createElement('span');

    const after = suggestBox.offsetHeight;

    if (suggestBox.getAnimations().some((a) => a.animationName === 'drop-in')) return; // rollt ohnehin noch auf
    suggestBox.animate([{ clipPath: `inset(-40px -40px ${after - before}px -40px)` }, { clipPath: 'inset(-40px)' }],
      { duration: 350, easing: 'cubic-bezier(.25, .8, .25, 1)' });
  }

  // Liste unter das Feld legen – fährt es gerade aus, erst wenn es seine Endbreite hat (slideDone)
  let suggestPending = false;
  function placeSuggest() {
    if (!suggestPending || address.classList.contains('resizing')) return;

    // Wallpaper durch. Kommt es nicht, nach SHOT_WAIT eben ohne.

      const s = shot;
      if (!s.wait) s.wait = setTimeout(() => { s.late = true; placeSuggest(); }, SHOT_WAIT);
      return;
    }
    suggestPending = false;
    const r = layoutRect(address);
    // Leiste links: Die Liste darf breiter als die Leiste sein und ragt dann über die Webseite
    const width = sideLeft() && !document.body.classList.contains('start') ? Math.max(r.width, 420) : r.width;
    Object.assign(suggestBox.style, { left: `${r.left}px`, top: `${r.bottom + 8}px`, width: `${width}px` });
    suggestBox.classList.add('open');
    reportOverlay();
    updateInk(); // gleich im selben Bild: Über einer hellen Seite wäre die Schrift sonst kurz weiß
  }
  // Offene Liste folgt dem Feld, wenn sich das Fenster (und damit Lage oder Breite des Felds) ändert
  function followSuggest() {
    if (!suggestBox.classList.contains('open')) return;
    suggestPending = true;
    placeSuggest();
  }
  addEventListener('resize', followSuggest);
  new ResizeObserver(followSuggest).observe(address);

  function markSelected() {
    suggestBox.querySelectorAll('.sg').forEach((row, i) => row.classList.toggle('sel', i === selected));
  }

  // Rust spart die Liste aus der Webseiten-Region aus, sonst läge die Seite darüber.
  // Layoutwerte statt getBoundingClientRect, damit die Einblend-Animation nicht mitgemessen wird.
  function reportOverlay() {
    if (suggestBox.classList.contains('open')) { coverPage(suggestBox, suggestMost()); return; }
    if (favPanel.classList.contains('open')) { coverPage(favPanel); return; }
    if (dlPanel.classList.contains('open')) { coverPage(dlPanel); return; }
    uncoverPage();
    if (upBox.classList.contains('open')) { reportUpdateOverlay(); return; } // das Modal bleibt ausgespart
    send('overlay', { rect: null });
  }

  // ---------- Glas über der Webseite: Seitenbild und Schatten ----------
  // Die Webseite ist ein eigenes Fenster über der Oberfläche. Wo Vorschläge oder Favoriten über ihr liegen, spart
  // Rust sie aus (overlay) – durch das Loch sähe man nur das Wallpaper. Deshalb liegt dort ein Bild der Seite, das
  // die Unschärfe des Glases verwischt. Ist es da, wird das Loch um SHADOW_ROOM größer: Der Schatten fällt auf die Seite.
  // Das Bild liegt, sobald es da ist, schon ganz unter der Seite (unsichtbar, die echte Seite liegt darüber): Öffnet
  // sich das Loch, ist es längst dekodiert und gezeichnet – sonst blitzte dort kurz das Wallpaper auf.
  const SHADOW_ROOM = 40, SHOT_WAIT = 250, pageShot = $('page-shot');
  let shot = null, shotSeq = 0, covered = null, dropTimer = 0;
  const shotReady = () => !!shot && shot.panes.every((p) => shot.images.has(p.id));
  function requestPageShot() {

      const part = document.createElement('div');
      Object.assign(part.style, { left: `${p.x}px`, top: `${p.y}px`, width: `${p.w}px`, height: `${p.h}px`,

    }));

  // ---------- Favoriten (nur lokal, im Speicher der Oberfläche) ----------
  const FAV_KEY = 'glass.favorites';

  const saveFavorites = () => { try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch { /* egal */ } };
  const sameUrl = (a, b) => a.replace(/#.*$/, '').replace(/\/$/, '') === b.replace(/#.*$/, '').replace(/\/$/, '');
  const isFavorite = (url) => !!url && favorites.some((f) => sameUrl(f.url, url));

  // Stern links in der Adresszeile
  const star = $('btn-star');
  function renderStar() {
    const tab = activeTab();

    star.hidden = !tab?.page;

  }
  // Über einer Webseite rollt die Liste erst mit deren Bild auf (wie die Vorschläge) – sonst schiene kurz das

  let favWait = 0;
  function openFavorites() {

  }

    if (!favPanel.classList.contains('open')) return;

  };

  // ---------- Downloads (Rust: downloads.rs) ----------
  // Knopf rechts oben – erst ab dem ersten Download dieser Sitzung – mit einer Glas-Liste wie bei den Favoriten:
  // beim Drüberfahren auf, ein Klick öffnet die Datei. Beginnt ein Download, klappt sie kurz von selbst auf.
  // Die Oberfläche kennt nur Nummern; Pfade und Dateien bleiben in Rust.
  const dlBtn = $('btn-dls'), dlPanel = $('dls');
  let downloads = [], dlTimer = 0, dlWait = 0, dlAuto = false; // dlAuto: von selbst aufgeklappt (neuer Download)
  const dlCmd = (what, id) => send(`download_${what}`, id == null ? {} : { id });
  function bytes(n) {
    if (n < 1024) return `${n} B`;
    const [v, unit] = n < 1024 ** 2 ? [n / 1024, 'KB'] : n < 1024 ** 3 ? [n / 1024 ** 2, 'MB'] : [n / 1024 ** 3, 'GB'];
    return `${v.toLocaleString('de-DE', { maximumFractionDigits: v < 10 ? 1 : 0 })} ${unit}`;
  }
  // „12,3 von 40 MB“ – die Einheit nur einmal, wenn beide gleich wären
  function progressText(d) {
    if (!d.total) return bytes(d.received);
    const [a, b] = [bytes(d.received), bytes(d.total)];
    return a.split(' ')[1] === b.split(' ')[1] ? `${a.split(' ')[0]} von ${b}` : `${a} von ${b}`;
  }
  function renderDownloadButton() {
    const running = downloads.filter((d) => d.state === 'progress');
    const known = running.length && running.every((d) => d.total > 0);
    const [got, all] = running.reduce(([g, t], d) => [g + d.received, t + d.total], [0, 0]);
    dlBtn.classList.toggle('busy', running.length > 0);
    dlBtn.classList.toggle('vague', running.length > 0 && !known);
    dlBtn.querySelector('circle').style.strokeDashoffset = known ? String(100 - Math.min(100, (got / all) * 100)) : '75';
    dlBtn.title = running.length ? `Downloads – ${running.length === 1 ? running[0].name : `${running.length} laufen`}` : 'Downloads';
  }
  function downloadRow(d) {
    const row = document.createElement('div');
    row.className = `fv dl ${d.state}`;
    row.title = d.url;
    row.innerHTML = `<span class="fv-ic">${svg('file')}</span><span class="fv-text"><span class="fv-title"></span><span class="dl-sub"></span></span>`;
    row.querySelector('.fv-title').textContent = d.name;
    const sub = row.querySelector('.dl-sub');
    if (d.state === 'progress') {
      sub.textContent = progressText(d);
      const bar = document.createElement('span');
      bar.className = `dl-bar${d.total ? '' : ' vague'}`;

    } else if (d.state === 'failed') sub.textContent = d.resumable ? 'Unterbrochen – zum Fortsetzen klicken' : 'Fehlgeschlagen';
    else if (d.state === 'missing') sub.textContent = 'Datei nicht mehr vorhanden';
    else sub.textContent = [bytes(d.received || d.total), hostOf(d.url), mailTime(d.time)].filter(Boolean).join(' · ');
    const action = (icon, title, what) => {
      const btn = document.createElement('button');
      btn.className = 'rm';
      btn.title = title;
      btn.innerHTML = svg(icon);
      btn.addEventListener('click', (e) => { e.stopPropagation(); dlCmd(what, d.id); });
      row.append(btn);
    };
    if (d.state === 'done') action('folder', 'Im Ordner zeigen', 'show');
    if (d.state === 'progress') action('close', 'Abbrechen', 'cancel');
    else action('close', 'Aus der Liste entfernen', 'remove');
    row.addEventListener('click', () => {
      if (d.state === 'done') { dlCmd('open', d.id); closeDownloads(); }

  function renderDownloads() {

  function placeDownloads() {

    dlPanel.classList.toggle('up', up);
    Object.assign(dlPanel.style, up
      ? { left: `${Math.max(8, r.left + r.width - 320)}px`, top: `${Math.max(8, r.top - 8 - dlPanel.offsetHeight)}px` }
      : { left: `${Math.max(8, r.left + r.width - 320)}px`, top: `${r.bottom + 8}px` });
    coverPage(dlPanel); // über einer Webseite: wie die Favoriten aus deren Region aussparen
    updateInk();
  }
  // Wie die Favoriten: über einer Webseite erst mit deren Bild aufrollen (höchstens SHOT_WAIT warten)
  function openDownloads() {
    clearTimeout(dlTimer);
    if (dlPanel.classList.contains('open') || dlWait || dlBtn.hidden) return;
    closeSuggest();
    closeFavorites();
    if (!editing()) requestPageShot();
    if (shot && !shotReady()) { dlWait = setTimeout(showDownloads, SHOT_WAIT); return; }
    showDownloads();
  }
  function showDownloads() {
    clearTimeout(dlWait);
    dlWait = 0;
    if (dlPanel.classList.contains('open')) return;
    dlPanel.classList.add('open');
    dlBtn.classList.add('open');

  }
  function closeDownloads() {
    clearTimeout(dlTimer);

  const closeDownloadsSoon = (wait = 250) => {

  window.setDownloads = ({ visible, items }, started) => {

    if (!editing() && !document.body.classList.contains('modal') && !dlPanel.classList.contains('open')) {

  dlPanel.addEventListener('pointerleave', () => closeDownloadsSoon());

  // ---------- Mail: alle Postfächer in einer Ansicht (Rust: mail.rs, Seiten: mail-content.js) ----------
  // Der Knopf oben rechts führt zur Mail-Ansicht (einem eigenen Tab). Links steht die gemeinsame Liste, rechts
  // legt Rust das Postfach der gewählten Mail als WebView darüber – die Oberfläche zeichnet nur dessen Rahmen.
  const mailBtn = $('btn-mail'), mailView = $('mailview'), mailHint = $('mail-hint');
  let mail = { boxes: [] };
  let mailFilter = 'all', mailSelected = null; // „all“, „unread“ oder ein Postfach
  const plural = (n) => (n > 999 ? '999+' : String(n));
  const inMailView = () => !!activeTab()?.mail;
  // Abzeichen zählen nur, was seit dem letzten Besuch der Mail-Ansicht neu ist – nicht alle Ungelesenen (die stehen
  // oben in der Mail-Ansicht). Gemerkt wird je Postfach die Zahl beim Verlassen der Ansicht; liest man woanders,
  // sinkt sie mit, sonst gingen neue Mails darin unter. Ein neu verbundenes Postfach beginnt bei 0.
  const MAIL_SEEN_KEY = 'glass.mailSeen';
  let mailSeen = {}, wasInMailView = false;
  try { mailSeen = JSON.parse(localStorage.getItem(MAIL_SEEN_KEY)) || {}; } catch { /* leer starten */ }
  function updateMailSeen(all = false) {
    let changed = false;
    for (const b of mail.boxes) {
      const seen = mailSeen[b.key];
      const next = !b.connected ? undefined : b.unread == null ? seen : all || seen == null ? b.unread : Math.min(seen, b.unread);
      if (next !== seen) { if (next === undefined) delete mailSeen[b.key]; else mailSeen[b.key] = next; changed = true; }
    }
    if (changed) try { localStorage.setItem(MAIL_SEEN_KEY, JSON.stringify(mailSeen)); } catch { /* egal */ }
  }
  const freshMail = (b) => (b.connected && b.unread != null ? Math.max(0, b.unread - (mailSeen[b.key] ?? b.unread)) : 0);
  // Mail-Ansicht verlassen: alles darin gilt als gesehen
  function mailViewShown(open) {
    if (wasInMailView && !open) { updateMailSeen(true); renderMailBadge(); }
    wasInMailView = open;
  }
  function renderMailBadge() {
    const fresh = mail.boxes.reduce((sum, b) => sum + freshMail(b), 0);
    const total = mail.boxes.reduce((sum, b) => sum + (b.connected && b.unread ? b.unread : 0), 0);
    mailBtn.querySelector('.mail-badge').textContent = fresh ? plural(fresh) : '';
    mailBtn.title = !total ? 'Mail' : `Mail – ${fresh ? `${fresh.toLocaleString('de-DE')} neu, ` : ''}${total.toLocaleString('de-DE')} ungelesen`;
  }
  window.mailState = (next) => {
    mail = next;
    updateMailSeen();
    renderMailBadge();
    if (!mail.boxes.some((b) => b.key === mailFilter)) mailFilter = mailFilter === 'unread' ? 'unread' : 'all';
    if (inMailView()) renderMailView();
  };
  // Feste Symbole je Postfach (wie bei den Suchanbietern): schon vor dem Verbinden zu erkennen, und sie wechseln nicht
  // mit der Seite (Outlooks Anmeldung zeigt sonst das Microsoft-Logo). Die Seite liefert nur den Ersatz.
  const MAIL_ICONS = {
    icloud: 'https://www.icloud.com/system/icloud.com/current/favicons/mail-favicon-light-180x180.png', // Mail, nicht die Wolke
    outlook: favicon('outlook.live.com'),
    gmail: 'https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico', // (der Dienst liefert für Gmail nur das Google-„G“)
  };
  const mailIcon = (box) => {
    const ic = document.createElement('span');
    ic.className = 'ml-ic';
    const src = MAIL_ICONS[box.key] || box.icon;
    if (src) {
      const img = new Image();
      img.onerror = () => { if (box.icon && img.src !== box.icon) img.src = box.icon; else ic.innerHTML = svg('mail'); };
      img.src = src;
      ic.append(img);
    } else ic.innerHTML = svg('mail');
    return ic;
  };
  // Heute die Uhrzeit, gestern „Gestern“, in dieser Woche der Wochentag, sonst das Datum
  function mailTime(ms) {
    const d = new Date(ms), now = new Date();
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((day(now) - day(d)) / 864e5);
    if (days <= 0) return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    if (days === 1) return 'Gestern';
    if (days < 7) return d.toLocaleDateString('de-DE', { weekday: 'short' });
    return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
  }
  function chip(label, { sel = false, off = false, cls = '', title = '', onClick }) {
    const el = document.createElement('button');
    el.className = `ml-box ${cls}${sel ? ' sel' : ''}${off ? ' off' : ''}`;
    el.title = title;
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = label;
    el.append(name);
    el.addEventListener('click', onClick);
    return el;
  }
  // Rechtsklick auf ein verbundenes Postfach: Menü mit „… trennen“ (angemeldet bleibt man dort trotzdem)
  const mailMenu = $('mail-menu'), mailForget = $('mail-forget');
  let mailMenuKey = null;
  function openMailMenu(e, b) {
    e.preventDefault();
    mailMenuKey = b.key;
    mailForget.textContent = `${b.name} trennen`;
    mailMenu.hidden = false;
    const x = Math.max(4, Math.min(e.clientX, innerWidth - mailMenu.offsetWidth - 4));
    const y = Math.max(4, Math.min(e.clientY, innerHeight - mailMenu.offsetHeight - 4));
    Object.assign(mailMenu.style, { left: `${x}px`, top: `${y}px` });
    // Reicht es über das Postfach rechts, spart Rust es dort aus
    send('overlay', { key: 'mail-menu', rect: { x, y, w: mailMenu.offsetWidth, h: mailMenu.offsetHeight, r: 12 } });
    mailForget.focus({ preventScroll: true });
  }
  function closeMailMenu() {
    if (mailMenu.hidden) return;
    mailMenu.hidden = true;
    mailMenuKey = null;
    send('overlay', { key: 'mail-menu', rect: null });
  }
  mailForget.addEventListener('click', () => {
    const key = mailMenuKey;

  }, true);
  addEventListener('blur', closeMailMenu);
  addEventListener('resize', closeMailMenu);
  function renderMailView() {
    const view = state.mailView;
    if (!view) return;
    const pane = view.pane;
    Object.assign(mailView.style, { left: `${view.x}px`, top: `${view.y}px`, width: `${pane.x - view.x - 6}px`, height: `${view.h}px` });
    const connected = mail.boxes.filter((b) => b.connected);
    const unread = connected.reduce((sum, b) => sum + (b.unread || 0), 0);
    if (!mail.boxes.some((b) => b.shown)) mailSelected = null; // rechts nichts offen: auch links nichts markiert

    const head = document.createElement('div');
    head.className = 'mv-head';
    head.innerHTML = '<h1>Mail</h1><span class="sub"></span>';
    head.querySelector('.sub').textContent = unread ? `${unread.toLocaleString('de-DE')} ungelesen` : '';

    // Filter: alle, nur ungelesene, einzelne Postfächer (zeigt es auch rechts); „+ Gmail“ verbindet
    const chips = document.createElement('div');
    chips.className = 'ml-boxes';
    if (connected.length) {
      chips.append(
        chip('Alle', { cls: 'filter', sel: mailFilter === 'all', onClick: () => { mailFilter = 'all'; renderMailView(); } }),
        chip('Ungelesen', { cls: 'filter', sel: mailFilter === 'unread', onClick: () => { mailFilter = mailFilter === 'unread' ? 'all' : 'unread'; renderMailView(); } }),
      );
    }
    for (const b of mail.boxes) {
      const el = chip(b.name, {
        sel: mailFilter === b.key, off: !b.connected, cls: b.signedOut ? 'out' : '',
        title: !b.connected ? `${b.name} verbinden – rechts erscheint die Anmeldung`
          : b.signedOut ? `${b.name}: nicht angemeldet – klicken, um dich rechts anzumelden`
          : `${b.name}${b.unread ? ` – ${b.unread.toLocaleString('de-DE')} ungelesen` : ''} – nur ${b.name} zeigen, rechts das Postfach (Rechtsklick: trennen)`,
        onClick: () => { mailFilter = b.key; mailSelected = null; send('mail_show', { value: b.key }); renderMailView(); },
      });
      el.prepend(mailIcon(b));
      // Abzeichen oben rechts, wie am Mail-Knopf: Ungelesene, „!“ (abgemeldet) oder „+“ (noch nicht verbunden)
      const badge = !b.connected ? ['+', 'add'] : b.signedOut ? ['!', 'warn'] : freshMail(b) ? [plural(freshMail(b)), ''] : null;
      if (badge) {
        const n = document.createElement('span');
        n.className = `badge ${badge[1]}`;
        // „+“ und „!“ als Zeichnung, damit sie genau in der Mitte stehen
        const GLYPH = {
          add: '<svg viewBox="0 0 10 10"><path d="M5 1.5v7M1.5 5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
          warn: '<svg viewBox="0 0 10 10"><path d="M5 1.6v4.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="5" cy="8.3" r="1.05" fill="currentColor"/></svg>',
        };
        if (GLYPH[badge[1]]) n.innerHTML = GLYPH[badge[1]];
        else n.textContent = badge[0];
        el.append(n);
      }
      if (b.connected) el.addEventListener('contextmenu', (e) => openMailMenu(e, b));
      chips.append(el);
    }

    // Die Mails aller (bzw. des gewählten) Postfächer, neueste zuerst
    const items = connected
      .filter((b) => mailFilter === 'all' || mailFilter === 'unread' || b.key === mailFilter)
      .flatMap((b) => (b.list || []).map((m) => ({ ...m, box: b })))
      .filter((m) => mailFilter !== 'unread' || m.unread)
      .sort((a, b) => b.time - a.time);
    const list = document.createElement('div');
    list.className = 'mv-list';
    for (const m of items) {
      const row = document.createElement('div');
      const id = `${m.box.key}:${m.key}`;
      row.className = `ml${m.unread ? ' unread' : ''}${id === mailSelected ? ' sel' : ''}`;
      row.title = `${m.box.name}: ${m.subject || '(kein Betreff)'}`;
      const dot = document.createElement('span');
      dot.className = 'dot';
      const from = document.createElement('span');
      from.className = 'from';
      from.textContent = m.from || m.box.name;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = mailTime(m.time);
      const line = document.createElement('div');
      line.className = 'line';
      const subject = document.createElement('b');
      subject.textContent = m.subject || '(kein Betreff)';
      line.append(subject);
      if (m.snippet) { const snip = document.createElement('span'); snip.textContent = ` – ${m.snippet}`; line.append(snip); }
      row.append(dot, mailIcon(m.box), from, time, line);

        : mailFilter === 'unread' ? 'Keine ungelesenen Mails in den geladenen Posteingängen.'

        : 'Die Postfächer laden – gleich erscheinen hier die neuesten Mails. Falls rechts eine Anmeldung steht, melde dich dort an.';
      list.append(empty);

    Object.assign(mailHint.style, { left: `${pane.x}px`, top: `${pane.y}px`, width: `${pane.w}px`, height: `${pane.h}px` });
    mailHint.innerHTML = connected.length
      ? '<div><b>Keine Mail ausgewählt</b>Wähle links eine Mail aus – oder ein Postfach, um es ganz zu sehen.</div>'
      : '<div><b>Deine Postfächer an einem Ort</b>Wähle links ein Postfach, um es zu verbinden. Die Anmeldung läuft direkt bei Apple bzw. Google – Glass sieht dein Passwort nie.</div>';
    scheduleInk();
    reportMailList();
  }
  mailBtn.addEventListener('click', () => send('mail_view'));
  // Die Liste reicht bis unter das rechte Ende der Such-Kapsel – die wächst mit dem Fenster und schrumpft mit vielen
  // Tabs, also nachmessen, sobald sie sich ändert (kurz verzögert: sie gleitet dabei). Beim Suchen fährt die Kapsel

  let mailListSent, mailListTimer = 0;
  function reportMailList() {
    clearTimeout(mailListTimer);
    mailListTimer = setTimeout(() => {
      const view = state.mailView;

      const width = sideLeft() ? null : Math.round(address.getBoundingClientRect().right - view.x);

  new ResizeObserver(reportMailList).observe(address);

  // ---------- Update-Modal (Rust meldet ein neueres Release von GitHub) ----------
  const upBox = $('update'), upInstall = $('up-install');
  let upDismissed = 0; // „Später“ gilt bis zum nächsten Start bzw. bis eine noch neuere Version kommt
  // Über einer Webseite liegt das Modal nur sichtbar, wenn Rust es aus deren Region ausspart
  const reportUpdateOverlay = () => send('overlay', { rect: {
    x: upBox.offsetLeft, y: upBox.offsetTop, w: upBox.offsetWidth, h: upBox.offsetHeight, r: 22 } });
  window.showUpdate = ({ build, current, notes }) => {

    $('up-notes').textContent = notes.split('\n').filter((l) => !/^co-authored-by/i.test(l.trim())).join('\n').trim().slice(0, 600);
    $('up-error').textContent = '';

  const closeUpdate = () => { upBox.classList.remove('open'); document.body.classList.remove('modal'); send('overlay', { rect: null }); };
  $('up-later').addEventListener('click', () => { upDismissed = Number(upBox.dataset.build) || 0; closeUpdate(); });

  // ---------- Standardbrowser (Rust meldet beim Start und bei jedem Fokus, ob Glass es schon ist) ----------
  const DEFAULT_HINT_KEY = 'glass.defaultBrowserHint.dismissed';

  favBtn.addEventListener('pointerenter', openFavorites);

  favPanel.addEventListener('pointerenter', () => clearTimeout(favTimer));
  favPanel.addEventListener('pointerleave', closeFavoritesSoon);

  // ---------- Hover, gemeldet von Rust ----------
  // Hat eine Webseite den Tastaturfokus, liefert WebView2 der Oberfläche keine Hover-Ereignisse.
  // Das Licht verfolgt auch die Position über Webseiten. Nur echte UI-Treffer erhalten .vh.
  let vhover = [];
  window.hoverAt = (x, y, overUI = true) => {
    chromeHover(x, y);

    // Leiste links, Startbildschirm: Oben fehlt die Leiste als Griff – die leere Fläche daneben ersetzt sie.
    // Verschoben wird erst nach ein paar Pixeln (wie auf Webseiten, content.js), ein Klick schließt so weiter Menüs.
    const bare = sideLeft() && document.body.classList.contains('start')
      && [document.body, document.documentElement, $('chrome')].includes(e.target);
    if (!bare && (!e.target.closest('[data-drag]') || e.target.closest('button, input, form, .tab, .capsule'))) return;
    const now = performance.now();
    const isDouble = now - lastDown.t < 400 && Math.hypot(e.clientX - lastDown.x, e.clientY - lastDown.y) < 6;
    lastDown = { t: isDouble ? 0 : now, x: e.clientX, y: e.clientY };
    if (isDouble) send('maximize');
    else if (bare) bareGrab = { x: e.clientX, y: e.clientY };
    else send('drag');
  });
  let bareGrab = null;
  document.addEventListener('pointermove', (e) => {
    if (!bareGrab) return;
    if (!(e.buttons & 1)) { bareGrab = null; return; }
    if (Math.hypot(e.clientX - bareGrab.x, e.clientY - bareGrab.y) < 4) return;
    bareGrab = null;
    send('drag');
  });
  document.addEventListener('pointerup', () => { bareGrab = null; });

  window.addEventListener('resize', () => requestAnimationFrame(placeLens));

  // Tabs in der Fenstermitte: Beide Seiten der Leiste reservieren so viel Platz, wie die breitere braucht
  const sides = [...document.querySelectorAll('#toolbar > .side')];
  const contentWidth = (side) => {
    const kids = [...side.children].filter((k) => k.offsetWidth);
    const gap = parseFloat(getComputedStyle(side).columnGap) || 0;
    return kids.reduce((sum, k) => {
      const cs = getComputedStyle(k);
      return sum + k.offsetWidth + parseFloat(cs.marginLeft) + parseFloat(cs.marginRight);
    }, Math.max(0, kids.length - 1) * gap);
  };
  // Wird es eng, gibt zuerst das Adressfeld nach (bis ADDRESS_MIN) – erst danach werden die Tabs schmaler.
  // TAB_WIDTH/TAB_GAP wie .tab und #tabs, TABBAR_EXTRA = „+“ samt Abstand (30 − 10 + 16) und Innenabstand (2 × 10).
  const TAB_WIDTH = 180, TAB_MIN = 34, TAB_GAP = 4, TABBAR_EXTRA = 56, ADDRESS_MIN = 160, ADDRESS_MAX = 260;
  const toolbar = $('toolbar'), center = document.querySelector('.center');
  let sidesFrame = 0;
  const balanceSides = () => {
    sidesFrame = 0;
    if (sideLeft()) return; // links stehen die Teile untereinander, jedes so breit wie die Leiste
    const cs = getComputedStyle(toolbar);
    const inner = toolbar.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2 * parseFloat(cs.columnGap);
    const n = [...$('tabs').querySelectorAll('.tab')].filter((t) => getComputedStyle(t).display !== 'none').length;
    const tabsNeed = document.body.classList.contains('multi') ? n * TAB_WIDTH + Math.max(0, n - 1) * TAB_GAP + TABBAR_EXTRA : 0;
    const fixed = contentWidth(sides[0]) - center.offsetWidth; // linke Seite ohne Adressfeld
    const dock = center.classList.contains('docked') ? parseFloat(getComputedStyle(center).getPropertyValue('--dock-width')) : 0;
    const width = Math.round(Math.max(ADDRESS_MIN, Math.min(ADDRESS_MAX, inner * .2, (inner - tabsNeed) / 2 - fixed - dock)));
    toolbar.style.setProperty('--address-width', `${width}px`);
    const left = fixed + width + dock, right = contentWidth(sides[1]), side = Math.max(left, right);
    // Ist das Fenster zu schmal für mittige Tabs (schon in Kompaktbreite), reserviert jede Seite nur ihren eigenen
    // Platz – sonst hielte rechts ungenutzte Fläche frei, und die Tabs liefen unter das „+“.
    const tabsMin = document.body.classList.contains('multi') ? n * TAB_MIN + Math.max(0, n - 1) * TAB_GAP + TABBAR_EXTRA : 0;
    const centered = inner - 2 * side >= tabsMin;
    toolbar.style.setProperty('--side-left', `${Math.ceil(centered ? side : left)}px`);
    toolbar.style.setProperty('--side-right', `${Math.ceil(centered ? side : right)}px`);
  };
  const scheduleSides = () => { if (!sidesFrame) sidesFrame = requestAnimationFrame(balanceSides); };
  const sidesObserver = new ResizeObserver(scheduleSides);
  sides.forEach((side) => [...side.children].forEach((k) => sidesObserver.observe(k)));
  addEventListener('resize', scheduleSides);
  let startLeft = false;
  try { startLeft = localStorage.getItem(TOOLBAR_SIDE_KEY) === 'left'; } catch { /* Sitzungseinstellung */ }
  applySide(startLeft); // vor „ready“: Rust legt die Seiten dann gleich richtig aus
  balanceSides();
  watchLens();
  send('ready');
})();
</script>
</body>
</html>
